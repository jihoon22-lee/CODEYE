id: review
version: 2.11.0
schema_version: '0.2'
language: ko
status: default
selection: the only review instructions; every node uses them
core: 00-core.md
roles:
  environment: environment.md
  documents: documents.md
  investigate: investigate.md
  interpret: interpret-diagnostics.md
  leads: leads.md
  triage: triage.md
  verify: verify.md
  contract: contract.md
domains: domains.md
languages:
  cpp: languages/cpp.md
  go: languages/go.md
  java: languages/java.md
  javascript: languages/javascript.md
  python: languages/python.md
  rust: languages/rust.md
language_selection: guides of the snapshot's in-scope source ecosystems (the analyzer packs' rule), sorted; none when no supported ecosystem is in scope
digest_policy:
  algorithm: sha256
  inputs: manifest-and-selected-files
  ordering: utf8-relative-path-ascending
  serialization: path-null-byte-content-null-byte
  note: Compute at run creation; do not trust a repository-supplied digest.
