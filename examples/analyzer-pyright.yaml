# Python 팩 pyright 어댑터 서술(추가 깊이, mypy와 대안). 구현: internal/worker/analysis/python, 근거: docs/ANALYZERS.md.
# pyright 1.1.414는 공유 node toolchain(--node)이 패키지의 JS 진입 스크립트를 실행한다(docs/ANALYZERS.md#공유-interpreter-toolchain). PATH는 node 디렉터리 하나뿐이다.
# --outputjson은 오류가 없으면 exit 0, 오류가 있으면 exit 1, 치명 오류 2, 설정 오류 3, 잘못된 CLI 4다(측정).
# -p는 task scratch의 CODEYE pyrightconfig.json이며 저장소 pyrightconfig.json·[tool.pyright]를 대신한다(overridden). 빈 scratch venv를 지정해
# 설정이 없을 때처럼 PATH의 python을 실행해 검색 경로를 묻지 않는다(가짜 interpreter로 측정). 파일 목록은 stdin("-")으로 준다.
schema_version: '0.1'
id: python.pyright
languages: [python]
planned_platforms: [linux, windows]
availability: verified  # Linux pyright 1.1.414 + node 24.18.0 실행으로 검증. Windows는 단위 테스트만 실행.
version_contract: pyright-1.1.414-fixture-tested
analysis_scope: [typed, intraprocedural, interfile]
executes_repository_code: false
requires_build: false
network_policy: none
version_probe:
  executable: '${node}'
  argv: ['${pyright_entry_script}', '--version']
execute:
  executable: '${node}'
  argv: ['${pyright_entry_script}', '--outputjson', '-p', '${scratch}/cfg', '-']
  cwd: '${workspace}/${module_dir}'
  timeout_seconds: 900
  stdout_max_bytes: 33554432
  env_allowlist: [PATH, LANG, SystemRoot]
exit_codes:
  clean: [0]
  findings: [1]
  error: [2, 3, 4]
parser:
  id: pyright-outputjson-v1
  format: json
  input: stdout-artifact
