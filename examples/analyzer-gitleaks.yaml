# 비밀값 팩 gitleaks 어댑터 서술. 구현: internal/worker/analysis/gitleaks, 근거: docs/ANALYZERS.md.
# gitleaks 8.30.1 dir은 workspace 사본만 검사한다(git 이력 미검사). --redact=100과 CODEYE 템플릿으로 규칙·경로·줄·열·entropy만 받는다. 비밀값·일부·hash는 어디에도 없고, 열·entropy는 원시 stdout에만 있고 관찰에는 넣지 않는다.
# --exit-code 3: 탐지 있음은 3, 없음은 0, 치명 오류·건너뛴 경로·없는 --config는 1, 알 수 없는 옵션은 126이다(측정). 종료 코드, info 로그 요약, 템플릿 레코드 수가 일치해야 성공이다.
# 설정은 CODEYE가 scratch에 쓴 --config(기본 규칙 확장)다. 저장소 .gitleaks.toml은 읽지 않고, 검사 루트의 .gitleaksignore는 도구가 항상 읽으므로 사본 밖을 가리키는 항목이 없을 때만 digest와 함께 적용한다.
# 인라인 gitleaks:allow는 무시한다(--ignore-gitleaks-allow). 범위의 각 루트는 '-- ./<root>'로 넘겨 옵션으로 읽히지 않는다.
schema_version: '0.1'
id: any.gitleaks
languages: [any]
planned_platforms: [linux, windows]
availability: verified  # Linux gitleaks 8.30.1 실행으로 검증. Windows는 단위·replay 테스트만 실행.
version_contract: gitleaks-8.30-fixture-tested
analysis_scope: [text]
purpose: secrets  # docs/ANALYZERS.md#분석기-목적; envelope analyzer.purpose와 같다
executes_repository_code: false
requires_build: false
network_policy: none
version_probe:
  executable: '${gitleaks}'
  argv: [version]
execute:
  executable: '${gitleaks}'
  argv: [dir, --no-banner, --no-color, --log-level, info, --redact=100, --config, '${scratch}/analyzers/gitleaks/codeye-gitleaks.toml', --gitleaks-ignore-path, '${scratch}/analyzers/gitleaks/ignore', --ignore-gitleaks-allow, --max-archive-depth, '0', --max-decode-depth, '5', --exit-code, '3', --report-format, template, --report-template, '${scratch}/analyzers/gitleaks/report.tmpl', --report-path, '-', --, '${scan_root}']
  cwd: '${workspace}'
  timeout_seconds: 900
  stdout_max_bytes: 33554432
  env_allowlist: [PATH, LANG, SystemRoot, HOME, USERPROFILE, TMPDIR, TMP, TEMP]
exit_codes:
  clean: [0]
  findings: [3]
  error: [1, 126]
parser:
  id: gitleaks-codeye-template
  format: json
  input: stdout-artifact
