# 중복 지표 팩 jscpd 어댑터 서술. 구현: internal/worker/analysis/jscpd, 근거: docs/ANALYZERS.md.
# jscpd 5.4.3은 --exit-code·threshold 없이 중복이 있든 없든 exit 0이다(측정). 중복 블록(minLines 10, minTokens 100, mode mild)은 지표 관찰이며 결함이 아니다.
# 설정은 CODEYE가 scratch에 쓴 --config 하나다: 저장소의 .jscpd.json, .config/jscpd.json, package.json "jscpd"는 읽지 않는다(측정).
# 파일 목록도 그 설정의 path에 절대 경로로 들어가고 output은 scratch다. 1,000,000바이트 초과·UTF-8 아닌 파일, node_modules·vendor·testdata·숨김 디렉터리는 넘기지 않고 따로 센다.
# 보고기는 stdout의 xcode 하나다. json 보고기는 중복된 소스 텍스트를 복사하므로(측정) 쓰지 않는다.
# jscpd는 node 진입 스크립트이며 PATH는 node 디렉터리만 담는다. 0이 아닌 종료 코드는 모두 실패다(측정: 없는 --config 1, 알 수 없는 옵션 2).
schema_version: '0.1'
id: any.jscpd
languages: [c, cpp, python, javascript, typescript, go, rust]
planned_platforms: [linux, windows]
availability: verified  # Linux jscpd 5.4.3(node v24.18.0) 실행으로 검증. Windows는 단위·replay 테스트만 실행.
version_contract: jscpd-5.4-fixture-tested
analysis_scope: [syntax, interfile]
purpose: metrics  # docs/ANALYZERS.md#분석기-목적; envelope analyzer.purpose와 같다
executes_repository_code: false
requires_build: false
network_policy: none
version_probe:
  executable: '${node}'
  argv: ['${jscpd}', --version]
execute:
  executable: '${node}'
  argv: ['${jscpd}', --config, '${scratch}/analyzers/jscpd/jscpd.json']
  cwd: '${workspace}'
  timeout_seconds: 900
  stdout_max_bytes: 33554432
  env_allowlist: [PATH, LANG, SystemRoot, JSCPD_NO_TIPS, JSCPD_CACHE_DIR, XDG_CACHE_HOME, HOME, USERPROFILE, TMPDIR, TMP, TEMP]
exit_codes:
  clean: [0]
  findings: []
  error: [1, 2]
parser:
  id: jscpd-xcode
  format: text
  input: stdout-artifact
