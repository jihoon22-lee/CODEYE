# JS/TS 팩 ESLint 기준선(javascript.eslint, Required) 서술. 구현: internal/worker/analysis/eslint, 근거: docs/ANALYZERS.md.
# 운영자 eslint 진입 스크립트(eslint/bin/eslint.js)를 공유 node toolchain으로 실행한다(PATH는 node 디렉터리만, #! 줄을 쓰지 않음).
# CODEYE 관리 flat config(작업 scratch)와 --no-config-lookup, --no-inline-config, 빈 --suppressions-location으로 저장소 설정 프로그램과
# 원본 내 지시문을 모두 끈다. plugin·parser는 eslint와 같은 도구 node_modules의 절대 경로로만 읽는다.
# eslint 10.15.0 실측: 오류 메시지(치명 구문 오류 포함)가 있으면 exit 1, 없으면 exit 0, crash·설정 오류·대상 없음은 exit 2.
# 결과 JSON은 stdout으로 받는다(관찰 raw_ref는 기록된 stdout 흐름에 묶인다). 위치 인자는 -- 뒤 ./ 접두다.
schema_version: '0.1'
id: javascript.eslint
languages: [javascript, typescript]
planned_platforms: [linux, windows]
availability: verified  # Linux node v24.18.0 + eslint 10.15.0(@eslint/js 10.0.1, typescript-eslint 8.73.0) 실행으로 검증. Windows는 단위 테스트만 실행.
version_contract: eslint-10.15-fixture-tested
analysis_scope: [syntax, intraprocedural]
executes_repository_code: false
requires_build: false
network_policy: none
version_probe:
  executable: '${node}'
  argv: ['${eslint}', --version]
execute:
  executable: '${node}'
  argv: ['${eslint}', --no-config-lookup, -c, '${scratch}/cfg/eslint.config.cjs', --no-inline-config, --suppressions-location, '${scratch}/cfg/eslint-suppressions.json',
         --no-warn-ignored, --no-error-on-unmatched-pattern, --format, json, --, '.']
  cwd: '${workspace}/${module_dir}'
  timeout_seconds: 900
  stdout_max_bytes: 67108864
  env_allowlist: [PATH, LANG, SystemRoot]
exit_codes:
  clean: [0]
  findings: [1]
  error: [2]
parser:
  id: eslint-json-v1
  format: json
  input: stdout-artifact
