# W17 Python 팩 mypy 어댑터 서술(추가 깊이, pyright와 대안). 구현: internal/worker/analysis/python, 근거: docs/42-w17-python-pack.md.
# mypy 2.4.1 -O json은 오류가 없으면 exit 0, 오류가 있으면 exit 1, 구문 오류·blocking 오류·사용법 오류는 exit 2다(측정).
# --config-file=(빈 값)은 mypy.ini·setup.cfg·pyproject의 설정과 plugins를 읽지 않는다(overridden). 경로 plugins는 실행 코드이므로 저장소 설정을 따르지 않는다.
# import-not-found·import-untyped는 관찰이 아닌 coverage 단위(import_unresolved, stub_missing)다. 처리 파일은 --lineprecision-report의 모듈 목록으로 확인한다.
schema_version: '0.1'
id: python.mypy
languages: [python]
planned_platforms: [linux, windows]
availability: verified  # Linux mypy 2.4.1 실행으로 검증. Windows는 단위 테스트만 실행.
version_contract: mypy-2.4-fixture-tested
analysis_scope: [typed, intraprocedural, interfile]
executes_repository_code: false
requires_build: false
network_policy: none
version_probe:
  executable: '${mypy}'
  argv: ['--version']
execute:
  executable: '${mypy}'
  argv: ['--config-file=', '--no-site-packages', '--explicit-package-bases', '--follow-imports=silent', '--check-untyped-defs', '--no-native-parser',
         '--disable-error-code=await-not-async', '--disable-error-code=name-defined', '--disable-error-code=no-redef', '--disable-error-code=str-format',
         '--python-version', '3.${minor}', '--platform', '${platform}', '--cache-dir', '${scratch}/cache', '-O', json,
         '--lineprecision-report', '${scratch}/report', '@${scratch}/cfg/files.txt']
  cwd: '${workspace}/${module_dir}'
  timeout_seconds: 900
  stdout_max_bytes: 33554432
  env_allowlist: [PATH, LANG, SystemRoot, PYTHONDONTWRITEBYTECODE, PYTHONNOUSERSITE, PYTHONSAFEPATH, MYPYPATH]
exit_codes:
  clean: [0]
  findings: [1]
  error: [2]
parser:
  id: mypy-json-lines-v1
  format: json
  input: stdout-artifact
