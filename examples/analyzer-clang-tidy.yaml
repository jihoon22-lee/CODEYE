# C/C++ 팩 추가 깊이 분석기 clang-tidy 어댑터 서술(Clang Static Analyzer는 clang-analyzer-* 검사로만 실행). 구현: internal/worker/analysis/cpp, 근거: docs/ANALYZERS.md.
# clang-tidy 23.1.5는 경고가 있어도 exit 0이다(WarningsAsErrors는 빈 값으로 고정). 그래서 findings는 종료 코드 범주가 아니다(빈 배열).
# exit 1은 한 실행의 번역 단위 중 하나라도 compiler error가 있을 때다. 오류 수는 실행 안에서 누적되므로 단위별 실패는 stderr 누적 수의 증가로 정한다.
# compile DB를 읽지 못한 "Running without flags."·사용법 오류·crash는 실패다. 스냅샷 compile DB도 이 attempt의 compile-db 작업이 만든 DB도 없으면 실행하지 않는다(unsupported/compile_db_missing).
# --config가 저장소 .clang-tidy를 대체하고 --extra-arg-before=--no-default-config가 clang driver 설정 파일을 막는다(실측). argv의 위치 인자는 작업 사본의 절대 경로다.
# 저장 전에 stdout의 소스 줄과 작업 사본 밖 위치의 진단을 지운다(docs/ANALYZERS.md#작업-사본-밖-파일-내용의-저장-차단). 아래 '${config}'는 cpp.ClangTidyConfig()의 inline YAML이다.
schema_version: '0.1'
id: cpp.clang_tidy
languages: [c, cpp]
planned_platforms: [linux, windows]
availability: verified  # Linux clang-tidy 23.1.5(conda-forge) 실행으로 검증. Windows는 단위 시험과 GOOS=windows vet만 실행.
version_contract: clang-tidy-23.1-fixture-tested
analysis_scope: [typed, intraprocedural, interprocedural]
executes_repository_code: false
requires_build: false
network_policy: none
version_probe:
  executable: '${clang_tidy}'
  argv: [--version]
execute:
  executable: '${clang_tidy}'
  argv: [-p, '${scratch}/work', '--config=${config}', --extra-arg-before=--no-default-config, --use-color=false, '${workspace}/${translation_unit}']
  cwd: '${scratch}/cwd'
  timeout_seconds: 1800
  stdout_max_bytes: 33554432
  env_allowlist: [PATH, LANG, SystemRoot]
exit_codes:
  clean: [0]
  findings: []
  error: [1]
parser:
  id: clang-tidy-text-v1
  format: text
  input: stdout-artifact
