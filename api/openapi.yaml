openapi: 3.1.0
info:
  title: CODEYE Core API
  version: 0.1.0
  description: >-
    핵심 수직 경로의 계약이다. `x-codeye-status` 값이 `implemented-w`로 시작하는 operation을
    `codeye serve`(loopback 전용 controller)가 실제로 제공하며 나머지는 아직 설계 계약이다
    (docs/24-w03-api.md, docs/28-w06-node-protocol.md, docs/31-w09-report.md, docs/38-w22-schedules-progress-sse.md). 운영 CRUD 전체는 docs/11-api-and-events.md에 따라 확장한다.
    의미 제약과 lease fencing은 JSON Schema 검증 외에 서버에서 검사한다.
    W03 사용자 인증은 UserSession cookie뿐이다. UserBearer는 구현되지 않았다.
    상태 변경 요청(POST/PATCH/DELETE)은 Origin이 서버 origin과 정확히 같아야 하고,
    POST /session을 제외하면 X-CODEYE-CSRF header가 필요하다. Host는 loopback allowlist만 허용한다.
    모든 응답은 X-Request-ID header를 가지며 오류 envelope의 request_id와 같다.
    W06 노드 경로(NodeBearer)는 cookie를 읽지 않고 CSRF를 쓰지 않으며 Origin header가 있으면 403으로 거부한다.
servers:
  - url: http://127.0.0.1:7331
    description: 개인 Native 모드의 제안 포트
security:
  - UserSession: []
paths:
  /api/v1/health:
    get:
      operationId: health
      x-codeye-status: implemented-w03
      security: []
      responses:
        '200':
          description: 프로세스 생존 상태. DB readiness와 다르다.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: ok}
  /api/v1/ready:
    get:
      operationId: ready
      x-codeye-status: implemented-w03
      security: []
      description: DB 연결과 migration 이력을 읽기 전용으로 확인한다. schema를 변경하지 않는다.
      responses:
        '200':
          description: DB 응답과 이력이 이 binary의 최신 migration과 일치
          content:
            application/json:
              schema:
                type: object
                required: [status, schema_version]
                properties:
                  status: {const: ready}
                  schema_version: {type: integer, minimum: 1}
        '503':
          description: 준비되지 않음. 자동 migration은 하지 않는다.
          content:
            application/json:
              schema:
                type: object
                required: [status, reason]
                properties:
                  status: {const: not_ready}
                  reason: {enum: [database_unavailable, schema_outdated, schema_newer, schema_inconsistent]}
  /api/v1/session:
    post:
      operationId: createSession
      x-codeye-status: implemented-w03
      security: []
      description: >-
        CLI(`codeye login-link`/`codeye serve --user`)가 0600 파일로 전달한 일회용 launch token(10분)을
        세션으로 교환한다. Origin 검사는 적용되고 CSRF header는 필요 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [launch_token]
              properties:
                launch_token: {type: string, minLength: 43, maxLength: 43}
      responses:
        '201':
          description: 세션 생성. codeye_session cookie(HttpOnly, SameSite=Strict, Path=/, 12시간)를 설정한다.
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionView'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: getSession
      x-codeye-status: implemented-w03
      responses:
        '200':
          description: 현재 세션과 CSRF token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionView'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteSession
      x-codeye-status: implemented-w03
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      responses:
        '204': {description: 세션 폐기와 cookie 삭제}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/source-roots:
    get:
      operationId: listSourceRoots
      x-codeye-status: implemented-w03
      description: 사용자에게 허가된 source root. 서버 경로는 반환하지 않는다.
      responses:
        '200':
          description: 허가된 root 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, label]
                      properties:
                        id: {type: string, format: uuid}
                        label: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/providers:
    get:
      operationId: listProviders
      x-codeye-status: implemented-w03
      description: 승인된 공개 HTTPS GitHub/GHES host. 비공개 저장소 인증은 아직 없다.
      responses:
        '200':
          description: provider 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, kind, host]
                      properties:
                        id: {type: string, format: uuid}
                        kind: {enum: [github, ghes]}
                        host: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects:
    get:
      operationId: listProjects
      x-codeye-status: implemented-w03
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: ACL을 통과한 프로젝트만 반환
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Project'}}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createProject
      x-codeye-status: implemented-w03
      description: >-
        source 선언을 형식·권한(root grant, provider 존재·host 일치)만 검사해 저장한다. 파일 시스템이나
        네트워크에 접근하지 않으므로 응답의 source_status는 declared_unverified다. 허가되지 않은 root와
        없는 provider는 같은 404다. ssh/scp/git:// URL은 422 SOURCE_UNSUPPORTED,
        attachment_ids가 있으면 422 ATTACHMENTS_UNSUPPORTED다.
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectCreate'}
      responses:
        '201':
          description: 프로젝트 등록. 상세 설명은 필수가 아니다.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/runs:
    parameters:
      - {name: project_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: createRun
      x-codeye-status: implemented-w03
      description: >-
        같은 actor·project·Idempotency-Key와 같은 body(정규화 JSON digest)는 같은 run을 202로 반환한다.
        다른 body는 409 IDEMPOTENCY_CONFLICT. viewer는 403, 프로젝트 비구성원은 404다.
        W03에는 worker가 없어 run은 queued에 머문다.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [profile, source_policy, scope]
              properties:
                profile: {enum: [deep-review, with-tests, focused]}
                source_policy: {const: latest_at_acquire}
                scope: {$ref: '#/components/schemas/Scope'}
      responses:
        '202':
          description: 영속 큐 등록 완료. 소스는 acquire에서 고정한다.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunAck'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}:
    parameters:
      - {name: project_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getProject
      x-codeye-status: implemented-w03
      responses:
        '200':
          description: 접근 가능한 프로젝트. 비구성원·없는 ID는 같은 404.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{run_id}:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getRun
      x-codeye-status: implemented-w03
      responses:
        '200':
          description: 현재 실행 상태
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunView'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{run_id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    post:
      operationId: cancelRun
      x-codeye-status: implemented-w03
      description: >-
        멱등적 취소 요청. 실제 하위 프로세스 종료는 run 상태로 확인한다. 실행 자식이 없는 queued run은
        cancelled로 바로 종료된다. recovery_required는 409.
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      responses:
        '202':
          description: 취소 의도 저장
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunAck'}
        '200':
          description: 이미 종료되었거나 이미 취소 중인 실행의 현재 상태(변경 없음)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunAck'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{run_id}/report:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getReport
      x-codeye-status: implemented-w09
      description: 프로젝트 읽기 권한으로 고정된 revision을 조회한다. 기본 내보내기는 도구 원문과 코드 인용을 생략한다.
      parameters:
        - {name: revision, in: query, schema: {type: integer, minimum: 1, maximum: 1000000}}
        - {name: format, in: query, schema: {enum: [json, markdown, html], default: json}}
        - {name: include_code, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: 검증된 보고서. X-CODEYE-Report-SHA256은 같은 내보내기 옵션의 JSON 해시이고 ETag는 요청 형식의 응답 해시다.
          content:
            application/json:
              schema: {$ref: '../schemas/report.schema.json'}
            text/markdown: {schema: {type: string}}
            text/html: {schema: {type: string}}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{run_id}/reports:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: listReports
      x-codeye-status: implemented-w09
      responses:
        '200':
          description: 프로젝트 읽기 권한으로 확인한 revision 목록. 게시 전에는 빈 목록이다.
          content:
            application/json:
              schema:
                type: object
                required: [items, latest_revision, formats, default_include_code]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, revision, status, quality_verdict, sha256, size_bytes, created_at]
                      properties:
                        id: {type: string}
                        revision: {type: integer, minimum: 1}
                        status: {enum: [completed, partial, failed, cancelled]}
                        quality_verdict: {enum: [attention_required, no_actionable_findings, inconclusive]}
                        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                        size_bytes: {type: integer}
                        created_at: {type: string, format: date-time}
                  latest_revision: {type: [integer, 'null']}
                  formats: {type: array, items: {enum: [json, markdown, html]}}
                  default_include_code: {const: false}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{run_id}/events:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: streamRunEvents
      x-codeye-status: implemented-w22
      description: >-
        GET /runs/{run_id}와 같은 세션·프로젝트 읽기 권한(비구성원 404). 먼저 GET /runs/{run_id}로 상태와 event_sequence를
        받고 그 값을 cursor로 연결한다. cursor 이후의 저장된 run 이벤트를 sequence 순서로 보낸다. 각 행은 이름 없는 SSE 메시지이며
        `id: <sequence>`와 RunEventData를 담는다(sequence는 상태 변경과 같은 트랜잭션에서 기록한 run 안의 단조 증가 값, DB 행 ID가 아님).
        행 묶음 뒤에는 id 없는 `event: run.view`(GET /runs/{run_id}와 같은 RunView)를 보낸다. id 없는 `event: heartbeat`는 연결 유지용이며
        진행 상태와 cursor를 바꾸지 않는다. `event: state.resync`(reason gap, cursor_ahead, cursor_expired, view_unavailable)는 이 cursor로
        이어갈 수 없다는 뜻이며 클라이언트는 GET /runs/{run_id}를 다시 읽고 새 event_sequence로 다시 연결한다. 서버는 resync 뒤 연결을 닫는다.
        `event: closed`(reason unauthenticated, access_revoked, unavailable)는 로그아웃·세션 만료·권한 상실 등으로 스트림을 끝낸다는 뜻이며
        다시 연결하지 않는다. 세션과 권한은 poll(기본 1초)마다 다시 확인한다. heartbeat 기본 15초, 재생 창 기본 1000 이벤트, 스트림 최대 30분
        (이후 브라우저가 Last-Event-ID로 재연결). 동시 스트림 상한을 넘으면 503 UNAVAILABLE.
      parameters:
        - {name: cursor, in: query, schema: {type: integer, minimum: 0}, description: 마지막으로 반영한 event sequence. Last-Event-ID가 있으면 그 값이 우선한다.}
        - {name: Last-Event-ID, in: header, schema: {type: string, pattern: '^[0-9]{1,16}$'}, description: 브라우저 재연결이 보내는 마지막 id}
      responses:
        '200':
          description: text/event-stream. data 줄은 RunEventData, RunView 또는 StreamControl JSON이다.
          content:
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/schedules:
    parameters:
      - {name: project_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: listSchedules
      x-codeye-status: implemented-w22
      description: 프로젝트 구성원(viewer 포함)이 삭제되지 않은 예약을 생성 순서로 본다. can_manage는 manager 여부다. 비구성원 404.
      responses:
        '200':
          description: 예약 목록
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, can_manage]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Schedule'}}
                  can_manage: {type: boolean}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createSchedule
      x-codeye-status: implemented-w22
      description: >-
        manager만 만든다(runner·viewer 403, 비구성원 404). 같은 actor·project·Idempotency-Key와 같은 정규화 정의는 같은 예약을 201로
        반환하고 다른 정의는 409 IDEMPOTENCY_CONFLICT(run의 멱등성 키와 별개). cron·timezone·policy·run 오류와 9년 안에 발생하지 않는 표현은
        422 VALIDATION_FAILED. 프로젝트당 살아 있는 예약 50개를 넘으면 409 CONFLICT. 첫 occurrence는 생성 시각 이후이며 과거를 소급 실행하지 않는다.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScheduleCreate'}
      responses:
        '201':
          description: 저장된 예약. ETag는 version이다.
          headers:
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/schedules/{schedule_id}:
    parameters:
      - {name: project_id, in: path, required: true, schema: {type: string}}
      - {name: schedule_id, in: path, required: true, schema: {type: string}}
    patch:
      operationId: updateSchedule
      x-codeye-status: implemented-w22
      description: >-
        manager만 바꾼다. If-Match는 현재 version("N")이어야 하며 다르면 409 CONFLICT, 없으면 400. 바꾼 사람이 예약 run의 요청자가 된다.
        cron·timezone 변경과 재활성화는 지금 이후의 다음 occurrence부터 다시 계산한다(비활성 기간을 소급하지 않음). 비활성화는 대기 중
        occurrence를 cancelled(schedule_disabled)로 닫는다.
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: 예약 version ETag}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SchedulePatch'}
      responses:
        '200':
          description: 새 version
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteSchedule
      x-codeye-status: implemented-w22
      description: manager만 지운다(soft delete). If-Match 규칙은 patch와 같다. occurrence와 run은 이력으로 남고 대기 중 occurrence는 cancelled(schedule_deleted)가 된다.
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: 예약 version ETag}
        - {$ref: '#/components/parameters/CSRF'}
      responses:
        '204': {description: 삭제됨}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/admin/pools/{pool_id}:
    parameters:
      - {name: pool_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getPool
      responses:
        '200':
          description: 관리자 권한 필요
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pool'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updatePool
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: 현재 revision ETag}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                min_workers: {type: integer, minimum: 0}
                max_workers: {type: integer, minimum: 0}
                idle_timeout_seconds: {type: integer, minimum: 1}
      responses:
        '200':
          description: 새 revision. min/max 의미 제약 검사, busy는 drain.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pool'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/enroll:
    post:
      operationId: enrollNode
      x-codeye-status: implemented-w06
      security: []
      description: >-
        운영자가 `codeye node token create`로 발급한 일회용·만료·철회 가능 등록 토큰을 node credential로 교환한다.
        토큰은 pool과 승인 source root 목록에 묶여 있다. Origin header가 있으면 403, cookie는 읽지 않는다.
        node_secret은 이 응답에서 한 번만 반환하며 서버는 SHA-256만 저장한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enrollment_token, name, protocol_version, os, arch]
              properties:
                enrollment_token: {type: string, minLength: 43, maxLength: 43}
                name: {type: string, minLength: 1, maxLength: 100}
                protocol_version: {const: '0.1'}
                os: {type: string, pattern: '^[a-z0-9_]{1,32}$'}
                arch: {type: string, pattern: '^[a-z0-9_]{1,32}$'}
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema:
                type: object
                required: [node_id, node_secret, pool_id, heartbeat_seconds, lease_seconds]
                properties:
                  node_id: {type: string, format: uuid}
                  node_secret: {type: string, minLength: 43, maxLength: 43}
                  pool_id: {type: string, format: uuid}
                  heartbeat_seconds: {type: integer, const: 5}
                  lease_seconds: {type: integer, const: 30}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{node_id}/heartbeat:
    parameters:
      - {$ref: '#/components/parameters/NodeId'}
    post:
      operationId: nodeHeartbeat
      x-codeye-status: implemented-w06
      security: [{NodeBearer: []}]
      description: >-
        관측 워커·능력·가용량·명령 cursor를 보고한다. 보고한 워커는 등록·갱신되고 목록에 없는 이 노드의 워커는
        stopped가 된다. cursor 이하 명령은 확인(ack) 처리한다. W06은 취소 요청된 run의 leased attempt마다
        cancel_attempt 명령 하나를 노드 행 잠금 아래에서 만든다(sequence = commit 순서). cleanup_reports의
        confirmed는 ConfirmCleanupNode로 처리하고, uncertain은 정보로만 받아 attempt를 recovery_required로 둔다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [protocol_version, observed_workers, capacity, capabilities, last_command_sequence]
              allOf:
                - if: {required: [worker_scaling], properties: {worker_scaling: {const: controller}}}
                  then: {required: [max_workers], properties: {max_workers: {minimum: 1}}}
                  else: {properties: {max_workers: {const: 0}}}
              properties:
                protocol_version: {const: '0.1'}
                observed_workers:
                  type: array
                  maxItems: 256
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, state, attempt_id]
                    properties:
                      id: {type: string, format: uuid}
                      state: {enum: [starting, idle, busy, draining, stopped, failed]}
                      attempt_id: {type: [string, 'null'], format: uuid}
                capacity:
                  type: object
                  additionalProperties: false
                  required: [cpu_cores, memory_available_bytes, disk_available_bytes]
                  description: >-
                    cpu_cores는 정책 예산(활성 예약 합을 뺀다). memory/disk는 OS 관측 여유이며 마지막 heartbeat 이후
                    생긴 예약만 뺀다(이중 계산 없음).
                  properties:
                    cpu_cores: {type: number, minimum: 0, maximum: 4096}
                    memory_available_bytes: {type: integer, minimum: 0}
                    disk_available_bytes: {type: integer, minimum: 0}
                capabilities:
                  type: array
                  maxItems: 128
                  uniqueItems: true
                  items: {type: string, pattern: '^(analysis:[a-z][a-z0-9-]{0,63}|source:local:[0-9a-f-]{36}|source:git:[a-z0-9.:-]+)$'}
                worker_scaling: {enum: [static, controller], default: static}
                max_workers: {type: integer, minimum: 0, maximum: 64, description: controller 모드에서 1~64 필수. static 모드에서는 생략 또는 0.}
                last_command_sequence: {type: integer, minimum: 0}
                cleanup_reports:
                  type: array
                  maxItems: 256
                  items: {$ref: '#/components/schemas/CleanupReport'}
      responses:
        '200':
          description: 상태 수신. cursor 이후 명령을 sequence 오름차순으로 반환한다.
          content:
            application/json:
              schema:
                type: object
                required: [server_time, commands, cleanup_results]
                properties:
                  server_time: {type: string, format: date-time}
                  commands:
                    type: array
                    items:
                      type: object
                      required: [command_id, sequence, kind, worker_id, attempt_id]
                      properties:
                        command_id: {type: string, format: uuid}
                        sequence: {type: integer, minimum: 1}
                        kind: {enum: [cancel_attempt, start_worker, drain_worker, stop_worker]}
                        worker_id: {type: [string, 'null']}
                        attempt_id: {type: [string, 'null']}
                  cleanup_results:
                    type: array
                    items:
                      type: object
                      required: [attempt_id, accepted, code]
                      properties:
                        attempt_id: {type: string}
                        accepted: {type: boolean}
                        code: {type: [string, 'null'], enum: [null, not_found, stale_attempt, conflict, invalid, unavailable, uncertain_not_applied]}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{node_id}/claims:
    parameters:
      - {$ref: '#/components/parameters/NodeId'}
    post:
      operationId: claimAttempt
      x-codeye-status: implemented-w06
      security: [{NodeBearer: []}]
      description: >-
        한 트랜잭션에서 scheduler_limits → node → project → run 순서로 잠그고, 전역 상한·노드 heartbeat 신선도·
        능력(analysis:profile, source)·노드 source root 허가·요청자 실행 권한과 source root grant·snapshot 위치·
        예약 여유를 확인한 뒤 attempt(epoch+1)·예약·run 전이·attempt.leased 이벤트·멱등 응답을 함께 저장한다.
        마지막 heartbeat에서 idle로 보고된 워커만 claim할 수 있다. 같은 Idempotency-Key와 같은 worker는 저장된
        200/204를 그대로 재전송하고 다른 worker는 409 IDEMPOTENCY_CONFLICT다.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [worker_id]
              properties:
                worker_id: {type: string, format: uuid}
      responses:
        '200':
          description: 자원 예약과 소유권을 원자적으로 할당
          content:
            application/json:
              schema:
                type: object
                required: [lease, job]
                properties:
                  lease: {$ref: '#/components/schemas/AttemptLease'}
                  job: {$ref: '#/components/schemas/Job'}
        '204': {description: 현재 배정할 호환 작업 없음(노드 stale·상한·여유 부족 포함)}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/attempts/{attempt_id}/heartbeat:
    parameters:
      - {$ref: '#/components/parameters/AttemptId'}
    post:
      operationId: renewAttempt
      x-codeye-status: implemented-w06
      security: [{NodeBearer: []}]
      description: DB 시각으로 lease를 30초 연장한다. 다른 노드의 attempt는 404, 다른 worker·이전 epoch·만료·종료는 409 STALE_ATTEMPT.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttemptOwner'}
      responses:
        '200':
          description: 소유권 갱신과 취소 의도
          content:
            application/json:
              schema:
                type: object
                required: [expires_at, cancel_requested]
                properties:
                  expires_at: {type: string, format: date-time}
                  cancel_requested: {type: boolean}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/attempts/{attempt_id}/events:
    parameters:
      - {$ref: '#/components/parameters/AttemptId'}
    post:
      operationId: recordAttemptEvent
      x-codeye-status: implemented-w06
      security: [{NodeBearer: []}]
      description: >-
        client_event_id 멱등. 같은 ID와 같은 kind·canonical payload는 저장 응답을 재전송하고 다른 본문은 409 CONFLICT.
        snapshot_fixed는 이 attempt가 먼저 올린 source_manifest artifact(sha256 = manifest_digest)를 요구하며
        같은 트랜잭션에서 snapshot과 snapshot_locations(이 노드)를 기록한다. 고정 입력 재시도에서는 저장된 snapshot과
        같아야 한다. task_created는 run 안의 key로 기존 task를 재사용한다. run_advance의 expected_version은 선택이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [worker_id, lease_epoch, client_event_id, kind, payload]
              properties:
                worker_id: {type: string, format: uuid}
                lease_epoch: {type: integer, minimum: 1}
                client_event_id: {type: string, format: uuid}
                kind: {enum: [snapshot_fixed, task_created, task_status, run_advance]}
                payload:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [manifest_digest, kind, consistency, source_sha, manifest_artifact_id]
                      properties:
                        manifest_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
                        kind: {enum: [local, git]}
                        consistency: {enum: [stable_copy_best_effort, git_commit]}
                        source_sha: {type: [string, 'null'], pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$'}
                        manifest_artifact_id: {type: string, format: uuid}
                    - type: object
                      additionalProperties: false
                      required: [key, required]
                      properties:
                        key: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,63}$'}
                        required: {type: boolean}
                        stage:
                          description: >-
                            W15 선택 필드. 없으면 단계 없이 저장한다(추정하지 않음). 알 수 없는 값·빈 문자열은 422.
                            key 재사용 시 생략은 저장값 유지, 다른 값은 409, 단계 없이 저장된 task에는 한 번 기록한다.
                          allOf: [{$ref: '#/components/schemas/TaskStage'}]
                        weight:
                          type: integer
                          minimum: 1
                          maximum: 1000
                          description: >-
                            W22 선택 필드. 가중 진행률의 task 가중치이며 없으면 1로 센다(작업 수 기준). 범위 밖은 422.
                            key 재사용 규칙은 stage와 같다(생략은 유지, 다른 값 409, 가중치 없이 저장된 task에는 한 번 기록).
                    - type: object
                      additionalProperties: false
                      required: [task_id, expected_version, status, reason]
                      properties:
                        task_id: {type: string, format: uuid}
                        expected_version: {type: integer, minimum: 1}
                        status: {$ref: '#/components/schemas/TaskStatus'}
                        reason: {type: [string, 'null'], pattern: '^[a-z][a-z0-9_]{0,63}$'}
                    - type: object
                      additionalProperties: false
                      required: [status]
                      properties:
                        status: {enum: [running, finalizing]}
                        expected_version: {type: integer, minimum: 1}
      responses:
        '200':
          description: 서버 sequence와 run version
          content:
            application/json:
              schema:
                type: object
                required: [sequence, run_version]
                properties:
                  sequence: {type: integer, minimum: 0}
                  run_version: {type: integer, minimum: 1}
                  snapshot_id: {type: string}
                  task_id: {type: string}
                  version: {type: integer, minimum: 1, description: task version}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/attempts/{attempt_id}/artifacts/{client_artifact_id}:
    parameters:
      - {$ref: '#/components/parameters/AttemptId'}
      - {name: client_artifact_id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: putAttemptArtifact
      x-codeye-status: implemented-w06
      security: [{NodeBearer: []}]
      description: >-
        bytes를 controller artifact 디렉터리의 sha256/aa/<sha>에 임시 파일 → hash·크기 확인 → fsync → rename으로 저장한 뒤
        DB 행을 finalized로 기록한다. 불일치는 아무것도 남기지 않는다. 같은 client_artifact_id와 같은 hash는 같은 201.
      parameters:
        - {name: X-CODEYE-Worker-ID, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: X-CODEYE-Lease-Epoch, in: header, required: true, schema: {type: integer, minimum: 1}}
        - {name: X-CODEYE-Artifact-Role, in: header, required: true, schema: {enum: [source_manifest, result_manifest, stdout, stderr, observations, raw_output, other]}}
        - {name: X-Content-SHA256, in: header, required: true, schema: {type: string, pattern: '^[0-9a-f]{64}$'}}
        - {name: Content-Length, in: header, required: true, schema: {type: integer, minimum: 0, maximum: 67108864}}
      requestBody:
        required: true
        content:
          '*/*':
            schema: {type: string, format: binary}
      responses:
        '201':
          description: 확정된 artifact
          content:
            application/json:
              schema:
                type: object
                required: [artifact_id, sha256, size_bytes, finalized]
                properties:
                  artifact_id: {type: string, format: uuid}
                  sha256: {type: string}
                  size_bytes: {type: integer}
                  finalized: {const: true}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '411': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/attempts/{attempt_id}/complete:
    parameters:
      - {$ref: '#/components/parameters/AttemptId'}
    post:
      operationId: completeAttempt
      x-codeye-status: implemented-w06
      security: [{NodeBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [worker_id, lease_epoch, outcome, cleanup_state, result_manifest_id, reason]
              properties:
                worker_id: {type: string, format: uuid}
                lease_epoch: {type: integer, minimum: 1}
                outcome: {enum: [succeeded, partial, failed, cancelled]}
                cleanup_state: {enum: [confirmed, uncertain]}
                result_manifest_id: {type: [string, 'null'], description: succeeded/partial이면 이 attempt의 finalized result_manifest artifact가 필수}
                reason: {type: [string, 'null'], pattern: '^[a-z][a-z0-9_]{0,63}$'}
      responses:
        '202':
          description: >-
            결과 접수. 성공은 finalizing을 거쳐 W09 게시 트랜잭션에서 종결된다. confirmed이면 예약 해제, uncertain이면
            recovery_required로 예약 유지. 같은 완료의 재전송은 같은 202.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunAck'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/attempts/{attempt_id}/cleanup:
    parameters:
      - {$ref: '#/components/parameters/AttemptId'}
    post:
      operationId: confirmAttemptCleanup
      x-codeye-status: implemented-w06
      security: [{NodeBearer: []}]
      description: recovery_required attempt의 실제 정리 확인. run은 failed가 되고 예약을 해제한다. heartbeat cleanup_reports와 같다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [worker_id, lease_epoch, cleanup_state, method, verified_at]
              properties:
                worker_id: {type: string, format: uuid}
                lease_epoch: {type: integer, minimum: 1}
                cleanup_state: {const: confirmed}
                method: {enum: [process_group_empty, job_object_closed, no_process_started]}
                verified_at: {type: string, format: date-time}
      responses:
        '202':
          description: 정리 확인 접수
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunAck'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/providers/{provider_id}/webhook:
    parameters:
      - {name: provider_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: receiveGitWebhook
      security: []
      description: 일반 세션 대신 raw body HMAC 검증이 필수다. durable 저장 이후 응답한다.
      parameters:
        - {name: X-Hub-Signature-256, in: header, required: true, schema: {type: string}}
        - {name: X-GitHub-Delivery, in: header, required: true, schema: {type: string}}
        - {name: X-GitHub-Event, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '202': {description: 검증된 이벤트 영속 저장}
        '200': {description: 이미 처리한 동일 delivery}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    UserBearer: {type: http, scheme: bearer, description: 미구현(향후 CLI/자동화용). W03 서버는 받지 않는다.}
    UserSession: {type: apiKey, in: cookie, name: codeye_session}
    NodeBearer: {type: http, scheme: bearer, description: '등록 응답의 node_secret(43자 base64url). 서버는 SHA-256만 저장한다. 철회된 노드는 401 NODE_UNAUTHENTICATED. 경로 node_id가 인증 노드와 다르거나 다른 노드의 attempt이면 404.'}
  parameters:
    RunId: {name: run_id, in: path, required: true, schema: {type: string}}
    NodeId: {name: node_id, in: path, required: true, schema: {type: string}}
    AttemptId: {name: attempt_id, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]+$'}}
    CSRF: {name: X-CODEYE-CSRF, in: header, required: true, description: GET /session 또는 POST /session 응답의 csrf_token, schema: {type: string}}
  responses:
    Error:
      description: >-
        인증·권한·검증·충돌·일시 오류. code와 retryable을 확인한다. W03 code:
        INVALID_REQUEST(400), UNAUTHENTICATED(401), FORBIDDEN/HOST_REJECTED/ORIGIN_REJECTED/CSRF_REJECTED(403),
        NOT_FOUND(404), METHOD_NOT_ALLOWED(405), CONFLICT/IDEMPOTENCY_CONFLICT(409), PAYLOAD_TOO_LARGE(413),
        UNSUPPORTED_MEDIA_TYPE(415), VALIDATION_FAILED/SOURCE_UNSUPPORTED/ATTACHMENTS_UNSUPPORTED(422),
        INTERNAL(500), UNAVAILABLE(503, retryable). W06 노드 code: NODE_UNAUTHENTICATED(401), STALE_ATTEMPT(409),
        LENGTH_REQUIRED(411), INTEGRITY_MISMATCH/PROTOCOL_UNSUPPORTED(422). W22: If-Match 누락·형식 오류는 INVALID_REQUEST(400),
        version 불일치는 CONFLICT(409).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
            request_id: {type: string}
            details: {type: object}
    Source:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, provider_id, repository_url, branch]
          properties:
            kind: {const: git}
            provider_id: {type: string, format: uuid}
            repository_url: {type: string, pattern: '^https://', description: 'https://<provider host>/<owner>/<repo>[.git]; 자격증명·query·fragment 금지'}
            branch: {type: string, minLength: 1, maxLength: 255}
        - type: object
          additionalProperties: false
          required: [kind, source_root_id, relative_path]
          properties:
            kind: {const: local}
            source_root_id: {type: string, format: uuid}
            relative_path: {type: string, minLength: 1, maxLength: 4096, description: '"." 또는 root 아래 상대 경로. 절대·드라이브·역슬래시·".." 금지'}
    Scope:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {enum: [full, paths]}
        paths: {type: array, items: {type: string}}
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        source: {$ref: '#/components/schemas/Source'}
        description: {type: string, maxLength: 20000}
        attachment_ids: {type: array, maxItems: 0, items: {type: string}, description: W03 미지원. 비어 있지 않으면 422}
    Project:
      type: object
      required: [id, name, source, revision, source_status, capability_gaps, last_run]
      properties:
        id: {type: string}
        name: {type: string}
        source: {$ref: '#/components/schemas/Source'}
        revision: {type: integer, minimum: 1}
        source_status:
          description: 선언만 저장됨. 실제 접근은 W04 acquire 전까지 확인하지 않는다.
          enum: [declared_unverified]
        capability_gaps:
          type: array
          description: >-
            source_access_unverified는 등록 시 소스 접근을 확인하지 않았음을 표시한다. report_unavailable은 이 프로젝트에 게시된 보고서가 없을 때 포함한다.
            execution_unavailable은 철회되지 않은 등록 노드가 하나도 없을 때만 포함한다(W06). 특정 run의 배치 가능 여부는
            run의 progress.waiting_reason으로 따로 보고한다.
          items: {enum: [source_access_unverified, execution_unavailable, report_unavailable]}
        last_run:
          description: 가장 최근에 요청한 run(R0 의미 유지). 대표 run은 activity.run이다.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, status]
              properties:
                id: {type: string}
                status: {$ref: '#/components/schemas/RunStatus'}
        activity: {$ref: '#/components/schemas/ProjectActivity'}
    TaskStage:
      description: >-
        task가 계획 시 기록하는 표시 단계(W15, docs/37 §2). domain.Stage와 migration 0006 CHECK와 같다.
        source/report는 서버 기록에서 계산하며 task 단계가 아니다.
      enum: [environment, documents, static_analysis, code_review, build, test]
    StageKey:
      description: 화면 단계. source, task 단계(environment, documents, build, test, static_analysis, code_review 순), report 순으로 반환한다.
      enum: [source, environment, documents, build, test, static_analysis, code_review, report]
    StageState:
      description: >-
        plan_pending(계획 미확정), no_tasks(계획 확정·해당 task 없음), waiting(모두 queued/blocked),
        running(시작·종료 기록이 있고 미종료 task가 남음), succeeded(모두 성공), skipped(성공 없이 모두
        skipped_policy/unsupported), failed(성공 없이 모두 failed/timed_out/budget_exhausted),
        cancelled(모두 cancelled), partial(종료됐지만 위 어느 것도 아님).
      enum: [plan_pending, no_tasks, waiting, running, succeeded, skipped, failed, cancelled, partial]
    StageDetail:
      description: recorded는 모든 task에 단계 기록이 있음. not_recorded는 단계 없는 task(W15 이전 워커·R0)가 있어 stages가 비어 있음.
      enum: [recorded, not_recorded]
    StageView:
      type: object
      additionalProperties: false
      required: [key, state, planned, finished, succeeded, counts, reasons, started_at, finished_at]
      properties:
        key: {$ref: '#/components/schemas/StageKey'}
        state: {$ref: '#/components/schemas/StageState'}
        planned:
          type: [integer, 'null']
          minimum: 0
          description: 현재 attempt가 계획을 확정한(running에 도달한) 뒤에만 task 수. source/report는 항상 null.
        finished: {type: integer, minimum: 0, description: 종료 상태 task 수(성공 포함)}
        succeeded: {type: integer, minimum: 0}
        counts:
          type: object
          description: 0이 아닌 성공 외 종료 상태별 건수
          additionalProperties: false
          properties:
            failed: {type: integer, minimum: 1}
            timed_out: {type: integer, minimum: 1}
            cancelled: {type: integer, minimum: 1}
            unsupported: {type: integer, minimum: 1}
            skipped_policy: {type: integer, minimum: 1}
            budget_exhausted: {type: integer, minimum: 1}
        reasons:
          type: array
          description: >-
            종료된 task의 사유 코드(중복 제거·정렬). model_source_not_approved(정책 제외), no_documents,
            no_tool_observations, no_environment_gap(검토 대상 없음) 등. source/report는 attempt 완료 사유·게시 거부 사유.
          items: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        started_at: {type: [string, 'null'], format: date-time, description: 서버가 수용한 DB 시각(현재 attempt)}
        finished_at: {type: [string, 'null'], format: date-time, description: 모든 task가 종료됐을 때의 마지막 종료 DB 시각}
    ProjectActivity:
      type: object
      additionalProperties: false
      description: >-
        W15 프로젝트 진행 요약. 대표 run은 실행·취소 처리 중(preparing, running, finalizing, cancel_requested,
        cancelling), recovery_required, queued, 종료 순, 같은 그룹에서 requested_at 내림차순, run ID 내림차순이다.
        목록과 상세는 같은 저장소 집계를 쓴다. 권한 없는 프로젝트는 응답에 나타나지 않는다.
      required: [run, other_active_runs, detail, stages, waiting_reason, last_report, last_event_at, checked_at]
      properties:
        run:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, status, requested_at]
              properties:
                id: {type: string}
                status: {$ref: '#/components/schemas/RunStatus'}
                requested_at: {type: string, format: date-time}
        other_active_runs: {type: integer, minimum: 0, description: 대표 run을 뺀 종료되지 않은 run 수}
        detail:
          description: run이 null이면 null
          oneOf:
            - type: 'null'
            - {$ref: '#/components/schemas/StageDetail'}
        stages: {type: array, items: {$ref: '#/components/schemas/StageView'}, description: run이 없거나 not_recorded이면 빈 배열}
        waiting_reason:
          type: [string, 'null']
          description: 대표 run이 queued일 때만 run progress.waiting_reason과 같은 저장소 계산 값. 그 외 null.
        last_report:
          description: 프로젝트에서 가장 최근에 게시된 보고서. run·revision에 고정한다.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [run_id, revision, published_at]
              properties:
                run_id: {type: string}
                revision: {type: integer, minimum: 1}
                published_at: {type: string, format: date-time}
        last_event_at: {type: [string, 'null'], format: date-time, description: 대표 run의 마지막 수용 이벤트 DB 시각}
        checked_at: {type: string, format: date-time, description: 서버가 읽은 시각. 생성 응답은 서버 시계, 조회는 DB 시각.}
    SessionView:
      type: object
      required: [user_id, csrf_token, expires_at]
      properties:
        user_id: {type: string, format: uuid}
        csrf_token: {type: string}
        expires_at: {type: string, format: date-time}
    RunStatus:
      enum: [queued, preparing, running, finalizing, cancel_requested, cancelling, recovery_required, completed, partial, failed, cancelled]
    RunAck:
      type: object
      required: [id, status, version, url]
      properties:
        id: {type: string}
        status: {$ref: '#/components/schemas/RunStatus'}
        version: {type: integer, minimum: 1}
        url: {type: string}
    RunTrigger:
      description: run이 생긴 이유(W22). manual은 사용자 요청, schedule은 예약 occurrence다.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: {const: manual}
        - type: object
          additionalProperties: false
          required: [kind, schedule_id, scheduled_for]
          properties:
            kind: {const: schedule}
            schedule_id: {type: string}
            scheduled_for: {type: string, format: date-time, description: occurrence의 UTC 시각}
    PlanChange:
      type: object
      additionalProperties: false
      description: 계획 확정 뒤 추가된 task 하나가 만든 계획 revision. 분모가 바뀐 이유를 설명한다.
      required: [revision, reason, stage, weight, planned_weight, recorded_at]
      properties:
        revision: {type: integer, minimum: 2}
        reason: {const: task_added}
        stage:
          oneOf:
            - type: 'null'
            - {$ref: '#/components/schemas/TaskStage'}
        weight: {type: integer, minimum: 1, maximum: 1000}
        planned_weight: {type: integer, minimum: 1, description: 이 변경 뒤의 분모}
        recorded_at: {type: [string, 'null'], format: date-time, description: task.created 이벤트의 DB 시각}
    RunEventData:
      type: object
      description: >-
        SSE 이벤트 행의 data(W22). run_id·sequence·version(그 이벤트 뒤의 run version)·type·at(DB 시각)과 payload 중 허용된
        구조화 필드만 담는다(status, task_id, key, required, stage, weight, reason, snapshot_id, attempt_id, epoch, report_id, revision,
        quality_verdict, closed_tasks, trigger, schedule_id, scheduled_for). 경로·로그·digest·노드/워커 식별자·자격증명은 보내지 않는다.
        type은 저장된 이벤트 종류(run.queued, attempt.leased, snapshot.fixed, task.created, task.status, run.status, report.published 등)다.
      required: [run_id, sequence, version, type, at]
      properties:
        run_id: {type: string}
        sequence: {type: integer, minimum: 1}
        version: {type: integer, minimum: 1}
        type: {type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'}
        at: {type: string, format: date-time}
      additionalProperties:
        type: [string, number, boolean, 'null']
    StreamControl:
      type: object
      additionalProperties: false
      description: state.resync, closed, heartbeat 이벤트의 data(W22). heartbeat에는 reason이 없다.
      required: [run_id]
      properties:
        run_id: {type: string}
        reason: {enum: [gap, cursor_ahead, cursor_expired, view_unavailable, unauthenticated, access_revoked, unavailable]}
        head: {type: integer, minimum: 0, description: 서버가 읽은 run의 최신 sequence}
        expected: {type: integer, minimum: 1, description: gap에서 기대한 sequence}
    ScheduleOverlap:
      description: coalesce_latest(기본, 실행 중 새 occurrence가 여러 번 오면 최신 1개만 대기), skip(실행 중이면 건너뜀), queue(모두 대기열에 넣되 종료되지 않은 run 10개까지)
      enum: [coalesce_latest, skip, queue]
    ScheduleMisfire:
      description: >-
        latest_once(기본): 평가하지 못한 사이 지난 occurrence 중 최신 하나만 실행하고 이전 것은 missed_from으로만 남긴다(무제한 catch-up 없음).
        skip: 그 최신 occurrence도 2분보다 늦게 발견되면 skipped(misfire)로 남긴다.
      enum: [latest_once, skip]
    ScheduleRun:
      type: object
      additionalProperties: false
      description: 수동 run 요청과 같은 계약. occurrence마다 일반 요청처럼 요청자 권한을 다시 검사하고 소스는 acquire에서 고정한다.
      required: [profile, source_policy, scope]
      properties:
        profile: {enum: [deep-review, with-tests, focused]}
        source_policy: {const: latest_at_acquire}
        scope: {$ref: '#/components/schemas/Scope'}
    ScheduleCreate:
      type: object
      additionalProperties: false
      required: [cron, timezone, run]
      properties:
        cron: {type: string, minLength: 1, maxLength: 200, description: '5필드(분 시 일 월 요일), 목록·범위·간격·월/요일 이름, 7=일요일, @hourly·@daily·@weekly·@monthly·@yearly. 두 날짜 필드가 모두 제한되면 OR, 하나가 *로 시작하면 AND.'}
        timezone: {type: string, minLength: 1, maxLength: 64, description: IANA 이름(예 Asia/Seoul, America/New_York, UTC). Local과 빈 값은 거부.}
        overlap: {$ref: '#/components/schemas/ScheduleOverlap'}
        misfire: {$ref: '#/components/schemas/ScheduleMisfire'}
        enabled: {type: boolean, default: true}
        run: {$ref: '#/components/schemas/ScheduleRun'}
    SchedulePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        cron: {type: string, minLength: 1, maxLength: 200}
        timezone: {type: string, minLength: 1, maxLength: 64}
        overlap: {$ref: '#/components/schemas/ScheduleOverlap'}
        misfire: {$ref: '#/components/schemas/ScheduleMisfire'}
        enabled: {type: boolean}
        run: {$ref: '#/components/schemas/ScheduleRun'}
    ScheduleOccurrence:
      type: object
      additionalProperties: false
      required: [scheduled_for, state, reason, missed_from, decided_at, run_id]
      properties:
        scheduled_for: {type: string, format: date-time}
        state: {enum: [enqueued, skipped, coalesced, cancelled]}
        reason:
          description: skipped·coalesced·cancelled의 사유. enqueued는 null.
          oneOf:
            - type: 'null'
            - enum: [overlap_active, queue_full, superseded, misfire, actor_forbidden, actor_disabled, project_deleted, schedule_disabled, schedule_deleted]
        missed_from: {type: [string, 'null'], format: date-time, description: latest_once가 실행하지 않은 이전 occurrence 구간의 시작}
        decided_at: {type: string, format: date-time}
        run_id: {type: [string, 'null'], description: enqueued일 때 만든 run}
    Schedule:
      type: object
      additionalProperties: false
      required: [id, project_id, cron, timezone, overlap, misfire, enabled, run, version, next_run_at, created_at, updated_at, last_occurrence, pending_occurrence]
      properties:
        id: {type: string}
        project_id: {type: string}
        cron: {type: string}
        timezone: {type: string}
        overlap: {$ref: '#/components/schemas/ScheduleOverlap'}
        misfire: {$ref: '#/components/schemas/ScheduleMisfire'}
        enabled: {type: boolean}
        run: {$ref: '#/components/schemas/ScheduleRun'}
        version: {type: integer, minimum: 1}
        next_run_at: {type: [string, 'null'], format: date-time, description: 아직 평가하지 않은 다음 occurrence(UTC). 비활성이면 null.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_occurrence:
          description: 가장 최근에 결정된 occurrence
          oneOf:
            - type: 'null'
            - {$ref: '#/components/schemas/ScheduleOccurrence'}
        pending_occurrence:
          description: coalesce_latest에서 실행 중인 run이 끝나기를 기다리는 최신 occurrence(예약마다 최대 하나)
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [scheduled_for, missed_from]
              properties:
                scheduled_for: {type: string, format: date-time}
                missed_from: {type: [string, 'null'], format: date-time}
    RunView:
      type: object
      required: [id, project_id, status, version, event_sequence, trigger, snapshot_id, progress]
      properties:
        id: {type: string}
        project_id: {type: string}
        status: {$ref: '#/components/schemas/RunStatus'}
        version: {type: integer, minimum: 1}
        event_sequence:
          type: integer
          minimum: 0
          description: >-
            W22. 이 응답을 읽기 시작할 때의 run 최신 event sequence. GET /runs/{run_id}/events의 cursor로 쓴다. 집계는 이 값 이후의
            이벤트를 이미 반영했을 수 있으므로 클라이언트는 이벤트를 무효화 신호로 다루고 event_sequence가 작아지는 응답을 적용하지 않는다.
        trigger: {$ref: '#/components/schemas/RunTrigger'}
        snapshot_id: {type: [string, 'null']}
        quality_verdict: {enum: [attention_required, no_actionable_findings, inconclusive, null]}
        report:
          type: [object, 'null']
          required: [revision, status, sha256, url]
          properties:
            revision: {type: integer, minimum: 1}
            status: {enum: [completed, partial, failed, cancelled]}
            sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
            url: {type: string}
        progress:
          type: object
          required: [stage, plan_revision, completed_tasks, total_tasks, estimated_percent, planned_weight, finished_weight, weight_basis, plan_changes, waiting_reason]
          properties:
            stage: {type: string, description: run 상태와 같다(R0 의미 유지). 세부 단계는 stages.}
            detail: {$ref: '#/components/schemas/StageDetail'}
            stages: {type: array, items: {$ref: '#/components/schemas/StageView'}, description: 프로젝트 activity.stages와 같은 집계(W15). not_recorded이면 빈 배열.}
            last_event_at: {type: [string, 'null'], format: date-time}
            checked_at: {type: string, format: date-time}
            plan_revision:
              type: [integer, 'null']
              minimum: 1
              description: >-
                W22. 현재 attempt가 계획을 확정(running 도달)하면 1, 그 뒤 추가된 task마다 1씩 증가한다. 확정 전 null.
                재시도한 run은 새 attempt가 다시 확정할 때 1부터 센다.
            completed_tasks: {type: integer, minimum: 0}
            total_tasks: {type: [integer, 'null'], minimum: 0}
            estimated_percent:
              type: [number, 'null']
              minimum: 0
              maximum: 100
              description: >-
                W22. 종료된 task 가중치 / 현재 revision의 계획 가중치 × 100(소수 첫째 자리). 계획 확정 전이나 계획 가중치가 0이면 null.
                저장된 task 상태만 쓰며 heartbeat·모델 토큰·경과 시간은 근거가 아니다. task 작업량 추정이며 보고서 게시(report 단계)는 포함하지 않는다.
            planned_weight: {type: [integer, 'null'], minimum: 0, description: W22. 현재 revision의 분모. 확정 전 null.}
            finished_weight: {type: [integer, 'null'], minimum: 0, description: W22. 종료(성공·실패·제외 포함)된 task의 가중치 합. 확정 전 null.}
            weight_basis:
              description: W22. task_count는 가중치를 선언한 task가 없어 작업 수 비율이라는 뜻이다. declared는 모두 선언, mixed는 일부 선언(미선언은 1).
              oneOf:
                - type: 'null'
                - enum: [task_count, declared, mixed]
            plan_changes: {type: array, items: {$ref: '#/components/schemas/PlanChange'}, description: W22. 분모가 바뀐 이유. revision 2부터 순서대로.}
            waiting_reason:
              type: [string, 'null']
              description: >-
                queued일 때만 구조화 데이터에서 계산한다(W06): request_unavailable(W06 이전 본문 미복원),
                execution_unavailable(철회되지 않은 등록 노드 없음), snapshot_unavailable, node_stale, no_capable_node
                (분석 handler가 없는 제품 빌드 포함), capacity_full, project_limit(프로젝트 동시 실행 상한), pool_paused(모든 호환 pool 중지). 호환 노드에 여유가 있으면 null. 그 외 상태는 null.
    Pool:
      type: object
      required: [id, revision, min_workers, max_workers, idle_timeout_seconds, observed_workers, capacity_state]
      properties:
        id: {type: string}
        revision: {type: integer, minimum: 1}
        min_workers: {type: integer, minimum: 0}
        max_workers: {type: integer, minimum: 0}
        idle_timeout_seconds: {type: integer, minimum: 1}
        observed_workers: {type: integer, minimum: 0}
        capacity_state: {enum: [healthy, degraded_capacity, over_target_draining, paused]}
    AttemptStatus:
      description: W02 내부 저장 상태. enrollment/claim HTTP 구현은 W06에서 제공한다.
      enum: [leased, recovery_required, released]
    CleanupState:
      enum: [pending, uncertain, confirmed]
    AttemptLease:
      type: object
      required: [run_id, attempt_id, worker_id, lease_epoch, expires_at, project_revision, snapshot_id, run_version]
      properties:
        run_id: {type: string}
        attempt_id: {type: string}
        worker_id: {type: string}
        lease_epoch: {type: integer, minimum: 1}
        expires_at: {type: string, format: date-time}
        project_revision: {type: integer, minimum: 1}
        snapshot_id: {type: [string, 'null']}
        run_version: {type: integer, minimum: 1, description: claim 직후 run version}
    Job:
      type: object
      required: [profile, scope, source, snapshot, resources]
      properties:
        profile: {enum: [deep-review, with-tests, focused]}
        scope: {$ref: '#/components/schemas/Scope'}
        source:
          oneOf:
            - type: object
              required: [kind, source_root_id, relative_path]
              description: 노드는 source_root_id를 자신의 비공개 경로 설정으로 해석한다. 서버는 경로를 보내지 않는다.
              properties:
                kind: {const: local}
                source_root_id: {type: string, format: uuid}
                relative_path: {type: string}
            - type: object
              required: [kind, repository_url, branch, host]
              properties:
                kind: {const: git}
                repository_url: {type: string}
                branch: {type: string}
                host: {type: string}
        snapshot:
          description: 고정 입력 재시도일 때만 존재. 노드는 보존 사본을 읽고 소스를 다시 확보하지 않는다.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, manifest_digest, kind, consistency, source_sha]
              properties:
                id: {type: string}
                manifest_digest: {type: string, pattern: '^[0-9a-f]{64}$'}
                kind: {enum: [local, git]}
                consistency: {enum: [stable_copy_best_effort, git_commit]}
                source_sha: {type: [string, 'null']}
        resources:
          type: object
          required: [cpu_millis, memory_bytes, disk_bytes]
          description: 예약(admission 회계)이며 OS 제한이 아니다.
          properties:
            cpu_millis: {type: integer, minimum: 0}
            memory_bytes: {type: integer, minimum: 0}
            disk_bytes: {type: integer, minimum: 0}
    AttemptOwner:
      type: object
      additionalProperties: false
      required: [worker_id, lease_epoch]
      properties:
        worker_id: {type: string, format: uuid}
        lease_epoch: {type: integer, minimum: 1}
    CleanupReport:
      type: object
      additionalProperties: false
      required: [attempt_id, worker_id, lease_epoch, cleanup_state, method, verified_at]
      properties:
        attempt_id: {type: string, format: uuid}
        worker_id: {type: string, format: uuid}
        lease_epoch: {type: integer, minimum: 1}
        cleanup_state: {enum: [confirmed, uncertain]}
        method: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        verified_at: {type: string, format: date-time}
    TaskStatus:
      enum: [queued, blocked, running, succeeded, failed, timed_out, cancelled, unsupported, skipped_policy, budget_exhausted]
