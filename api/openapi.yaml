openapi: 3.1.0
info:
  title: CODEYE Core API
  version: 0.1.0
  description: >-
    구현할 핵심 수직 경로의 설계 계약이다. 현재 실행 중인 API라는 뜻이 아니다.
    운영 CRUD 전체는 docs/11-api-and-events.md에 따라 확장한다.
    의미 제약과 lease fencing은 JSON Schema 검증 외에 서버에서 검사한다.
servers:
  - url: http://127.0.0.1:7331
    description: 개인 Native 모드의 제안 포트
security:
  - UserBearer: []
  - UserSession: []
paths:
  /api/v1/health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: 프로세스 생존 상태. DB readiness와 다르다.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: ok}
  /api/v1/projects:
    get:
      operationId: listProjects
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: ACL을 통과한 프로젝트만 반환
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Project'}}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectCreate'}
      responses:
        '201':
          description: 프로젝트 등록. 상세 설명은 필수가 아니다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/runs:
    parameters:
      - {name: project_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: createRun
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [profile, source_policy, scope]
              properties:
                profile: {enum: [deep-review, with-tests, focused]}
                source_policy: {const: latest_at_acquire}
                scope: {$ref: '#/components/schemas/Scope'}
      responses:
        '202':
          description: 영속 큐 등록 완료. 소스는 acquire에서 고정한다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunAck'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{run_id}:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getRun
      responses:
        '200':
          description: 현재 실행 상태
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunView'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{run_id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    post:
      operationId: cancelRun
      description: 멱등적 취소 요청. 실제 하위 프로세스 종료는 run 상태로 확인한다.
      responses:
        '202':
          description: 취소 의도 저장
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunAck'}
        '200':
          description: 이미 종료된 실행의 현재 상태
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunAck'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{run_id}/report:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getReport
      parameters:
        - {name: revision, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: 검증된 report revision
          content:
            application/json:
              schema: {$ref: '../schemas/report.schema.json'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{run_id}/events:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: streamRunEvents
      parameters:
        - {name: Last-Event-ID, in: header, schema: {type: string}}
      responses:
        '200':
          description: run별 단조 증가 sequence. cursor 만료 시 state.resync 이벤트로 재조회 요청.
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/admin/pools/{pool_id}:
    parameters:
      - {name: pool_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getPool
      responses:
        '200':
          description: 관리자 권한 필요
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pool'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updatePool
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: 현재 revision ETag}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                min_workers: {type: integer, minimum: 0}
                max_workers: {type: integer, minimum: 0}
                idle_timeout_seconds: {type: integer, minimum: 1}
      responses:
        '200':
          description: 새 revision. min/max 의미 제약 검사, busy는 drain.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pool'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{node_id}/heartbeat:
    parameters:
      - {$ref: '#/components/parameters/NodeId'}
    post:
      operationId: nodeHeartbeat
      security: [{NodeBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [protocol_version, observed_workers, capacity, capabilities, last_command_id]
              properties:
                protocol_version: {const: '0.1'}
                observed_workers:
                  type: array
                  items:
                    type: object
                    required: [id, state, attempt_id]
                    properties:
                      id: {type: string}
                      state: {enum: [starting, idle, busy, draining, stopped, failed]}
                      attempt_id: {type: [string, 'null']}
                capacity:
                  type: object
                  required: [cpu_cores, memory_available_mb, disk_available_mb]
                  properties:
                    cpu_cores: {type: number, minimum: 0}
                    memory_available_mb: {type: integer, minimum: 0}
                    disk_available_mb: {type: integer, minimum: 0}
                capabilities: {type: array, uniqueItems: true, items: {type: string}}
                last_command_id: {type: [string, 'null']}
      responses:
        '200':
          description: 상태 수신 및 멱등 명령 전달
          content:
            application/json:
              schema:
                type: object
                required: [server_time, commands]
                properties:
                  server_time: {type: string, format: date-time}
                  commands:
                    type: array
                    items:
                      type: object
                      required: [command_id, kind, worker_id]
                      properties:
                        command_id: {type: string}
                        kind: {enum: [start_worker, drain_worker, cancel_attempt, reconcile]}
                        worker_id: {type: string}
                        attempt_id: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{node_id}/claims:
    parameters:
      - {$ref: '#/components/parameters/NodeId'}
    post:
      operationId: claimAttempt
      security: [{NodeBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [worker_id]
              properties:
                worker_id: {type: string, minLength: 1}
      responses:
        '200':
          description: 자원 예약과 소유권을 원자적으로 할당
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttemptLease'}
        '204': {description: 현재 배정할 호환 작업 없음}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/attempts/{attempt_id}/heartbeat:
    parameters:
      - {$ref: '#/components/parameters/AttemptId'}
    post:
      operationId: renewAttempt
      security: [{NodeBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [worker_id, lease_epoch]
              properties:
                worker_id: {type: string}
                lease_epoch: {type: integer, minimum: 1}
      responses:
        '200':
          description: 소유권 갱신과 취소 의도
          content:
            application/json:
              schema:
                type: object
                required: [expires_at, cancel_requested]
                properties:
                  expires_at: {type: string, format: date-time}
                  cancel_requested: {type: boolean}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/attempts/{attempt_id}/complete:
    parameters:
      - {$ref: '#/components/parameters/AttemptId'}
    post:
      operationId: completeAttempt
      security: [{NodeBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lease_epoch, outcome, cleanup_state, result_manifest_id]
              properties:
                lease_epoch: {type: integer, minimum: 1}
                outcome: {enum: [succeeded, partial, failed, cancelled]}
                cleanup_state: {enum: [confirmed, uncertain]}
                result_manifest_id: {type: [string, 'null']}
      responses:
        '202':
          description: 결과 접수. 서버가 artifact·task·cleanup을 확인해 최종 상태 결정.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunAck'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/providers/{provider_id}/webhook:
    parameters:
      - {name: provider_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: receiveGitWebhook
      security: []
      description: 일반 세션 대신 raw body HMAC 검증이 필수다. durable 저장 이후 응답한다.
      parameters:
        - {name: X-Hub-Signature-256, in: header, required: true, schema: {type: string}}
        - {name: X-GitHub-Delivery, in: header, required: true, schema: {type: string}}
        - {name: X-GitHub-Event, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '202': {description: 검증된 이벤트 영속 저장}
        '200': {description: 이미 처리한 동일 delivery}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    UserBearer: {type: http, scheme: bearer}
    UserSession: {type: apiKey, in: cookie, name: codeye_session}
    NodeBearer: {type: http, scheme: bearer, description: node 또는 attempt 범위와 만료를 검사하는 토큰}
  parameters:
    RunId: {name: run_id, in: path, required: true, schema: {type: string}}
    NodeId: {name: node_id, in: path, required: true, schema: {type: string}}
    AttemptId: {name: attempt_id, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
  responses:
    Error:
      description: 인증·권한·검증·충돌·일시 오류. code와 retryable을 확인한다.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
            request_id: {type: string}
            details: {type: object}
    Source:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, provider_id, repository_url, branch]
          properties:
            kind: {const: git}
            provider_id: {type: string}
            repository_url: {type: string}
            branch: {type: string, minLength: 1}
        - type: object
          additionalProperties: false
          required: [kind, source_root_id, relative_path]
          properties:
            kind: {const: local}
            source_root_id: {type: string}
            relative_path: {type: string, minLength: 1}
    Scope:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {enum: [full, paths]}
        paths: {type: array, items: {type: string}}
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        source: {$ref: '#/components/schemas/Source'}
        description: {type: string, maxLength: 20000}
        attachment_ids: {type: array, items: {type: string}}
    Project:
      type: object
      required: [id, name, source, revision]
      properties:
        id: {type: string}
        name: {type: string}
        source: {$ref: '#/components/schemas/Source'}
        revision: {type: integer, minimum: 1}
    RunStatus:
      enum: [queued, preparing, running, finalizing, cancel_requested, cancelling, recovery_required, completed, partial, failed, cancelled]
    RunAck:
      type: object
      required: [id, status, version]
      properties:
        id: {type: string}
        status: {$ref: '#/components/schemas/RunStatus'}
        version: {type: integer, minimum: 1}
    RunView:
      type: object
      required: [id, project_id, status, version, snapshot_id, progress]
      properties:
        id: {type: string}
        project_id: {type: string}
        status: {$ref: '#/components/schemas/RunStatus'}
        version: {type: integer, minimum: 1}
        snapshot_id: {type: [string, 'null']}
        quality_verdict: {enum: [attention_required, no_actionable_findings, inconclusive, null]}
        progress:
          type: object
          required: [stage, plan_revision, completed_tasks, total_tasks, estimated_percent, waiting_reason]
          properties:
            stage: {type: string}
            plan_revision: {type: [integer, 'null'], minimum: 1}
            completed_tasks: {type: integer, minimum: 0}
            total_tasks: {type: [integer, 'null'], minimum: 0}
            estimated_percent: {type: [number, 'null'], minimum: 0, maximum: 100}
            waiting_reason: {type: [string, 'null']}
    Pool:
      type: object
      required: [id, revision, min_workers, max_workers, idle_timeout_seconds, observed_workers, capacity_state]
      properties:
        id: {type: string}
        revision: {type: integer, minimum: 1}
        min_workers: {type: integer, minimum: 0}
        max_workers: {type: integer, minimum: 0}
        idle_timeout_seconds: {type: integer, minimum: 1}
        observed_workers: {type: integer, minimum: 0}
        capacity_state: {enum: [healthy, degraded_capacity, over_target_draining, paused]}
    AttemptLease:
      type: object
      required: [run_id, attempt_id, worker_id, lease_epoch, expires_at, project_revision, snapshot_id]
      properties:
        run_id: {type: string}
        attempt_id: {type: string}
        worker_id: {type: string}
        lease_epoch: {type: integer, minimum: 1}
        expires_at: {type: string, format: date-time}
        project_revision: {type: integer, minimum: 1}
        snapshot_id: {type: [string, 'null']}
