openapi: 3.1.0
info:
  title: CODEYE Core API
  version: 0.1.0
  description: >-
    핵심 수직 경로의 계약이다. `x-codeye-status` 값이 `implemented`인 operation을
    `codeye serve`(controller)가 실제로 제공하며 나머지는 아직 설계 계약이다
    (docs/API.md, docs/EXECUTION.md, docs/REPORT.md). 운영 CRUD 전체는 docs/API.md에 따라 확장한다.
    의미 제약과 lease fencing은 JSON Schema 검증 외에 서버에서 검사한다.
    사용자 인증은 UserSession cookie뿐이다(로그인 링크 또는 사용자 이름·비밀번호로 만든다). UserBearer는 구현되지 않았다.
    상태 변경 요청(POST/PUT/PATCH/DELETE)은 Origin이 서버 origin과 정확히 같아야 하고,
    POST /session을 제외하면 X-CODEYE-CSRF header가 필요하다. loopback 수신은 평문 HTTP와 loopback Host
    allowlist를 쓴다. 그 밖의 주소는 TLS가 필수이며 Host는 public origin의 host, Origin은 public origin과 같아야 하고,
    cookie 이름은 __Host-codeye_session(Secure)이며 Strict-Transport-Security를 보낸다(docs/SECURITY.md).
    비밀번호 변경이 필요한 세션(must_change_password)은 GET/DELETE /session과 POST /session/password 밖의
    사용자 경로에서 403 PASSWORD_CHANGE_REQUIRED를 받는다. 관리자(is_admin)는 계정·source root 허가·감사 기록을
    다루며 어떤 프로젝트도 열지 못한다.
    모든 응답은 X-Request-ID header를 가지며 오류 envelope의 request_id와 같다.
    노드 경로(NodeBearer)는 cookie를 읽지 않고 CSRF를 쓰지 않으며 Origin header가 있으면 403으로 거부한다.
servers:
  - url: http://127.0.0.1:7331
    description: 개인 Native 모드의 제안 포트
  - url: https://codeye.example
    description: TLS 수신(--tls-cert, --tls-key, --public-origin)의 예. 실제 주소는 운영자가 정한다.
security:
  - UserSession: []
paths:
  /api/v1/health:
    get:
      operationId: health
      x-codeye-status: implemented
      security: []
      responses:
        '200':
          description: 프로세스 생존 상태. DB readiness와 다르다.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: ok}
  /api/v1/ready:
    get:
      operationId: ready
      x-codeye-status: implemented
      security: []
      description: DB 연결과 migration 이력을 읽기 전용으로 확인한다. schema를 변경하지 않는다.
      responses:
        '200':
          description: DB 응답과 이력이 이 binary의 최신 migration과 일치
          content:
            application/json:
              schema:
                type: object
                required: [status, schema_version]
                properties:
                  status: {const: ready}
                  schema_version: {type: integer, minimum: 1}
        '503':
          description: 준비되지 않음. 자동 migration은 하지 않는다.
          content:
            application/json:
              schema:
                type: object
                required: [status, reason]
                properties:
                  status: {const: not_ready}
                  reason: {enum: [database_unavailable, schema_outdated, schema_newer, schema_inconsistent]}
  /api/v1/session:
    post:
      operationId: createSession
      x-codeye-status: implemented
      security: []
      description: >-
        둘 중 하나로 세션을 만든다. (1) CLI(`codeye login-link`/`codeye serve --user`)가 0600 파일로 전달했거나
        관리자 API가 돌려준 일회용 launch token(10분). (2) 사용자 이름(대소문자 무시)과 비밀번호.
        두 형식을 섞거나 일부만 보내면 400이다. 없는 사용자, 틀린 비밀번호, 비활성 사용자, 비밀번호 없는 사용자는
        모두 같은 401과 같은 문구이며 같은 비용(KDF 한 번)이 든다. 계정(제출한 이름)별·접속 주소별 실패가 한도를 넘으면
        맞는 비밀번호도 429 RATE_LIMITED와 Retry-After를 받는다. launch token 실패도 주소별 한도에 센다.
        Origin 검사는 적용되고 CSRF header는 필요 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [launch_token]
                  properties:
                    launch_token: {type: string, minLength: 43, maxLength: 43}
                - type: object
                  additionalProperties: false
                  required: [username, password]
                  properties:
                    username: {type: string, minLength: 1, maxLength: 256}
                    password: {type: string, maxLength: 1024, writeOnly: true}
      responses:
        '201':
          description: >-
            세션 생성. 세션 cookie(HttpOnly, SameSite=Strict, Path=/, 12시간; TLS면 __Host-codeye_session과 Secure)를 설정한다.
            must_change_password가 true면 비밀번호를 정할 때까지 POST /session/password와 로그아웃만 쓸 수 있다.
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionView'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '429':
          description: 로그인 제한. Retry-After(초)와 details.retry_after_seconds가 같다.
          headers:
            Retry-After: {schema: {type: integer, minimum: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: getSession
      x-codeye-status: implemented
      responses:
        '200':
          description: 현재 세션과 CSRF token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionView'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteSession
      x-codeye-status: implemented
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      responses:
        '204': {description: 세션 폐기와 cookie 삭제}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/session/password:
    post:
      operationId: changePassword
      x-codeye-status: implemented
      description: >-
        이 세션 사용자의 비밀번호를 정하거나 바꾼다. 비밀번호가 있는 사용자는 current_password가 필수다(없으면 400).
        비밀번호가 없는 사용자(관리자가 만들었거나 재설정한 계정)는 current_password 없이 처음 정한다.
        새 비밀번호는 12~256자, 사용자 이름·표시 이름과 같지 않고 한 문자 반복이 아니어야 한다(422; 현재 비밀번호보다
        먼저 검사하고 시도로 세지 않는다). 성공하면 이 사용자의 다른 세션과 쓰지 않은 로그인 링크를 모두 끝내고 이 세션은 유지하며
        must_change_password를 지운다. 사용자 이름이 없는 사용자(로그인 링크 전용)와, 검증 뒤 비밀번호가 재설정·변경된
        경우는 409다. must_change_password 세션도 쓸 수 있다.
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_password]
              properties:
                current_password: {type: string, writeOnly: true}
                new_password: {type: string, minLength: 1, writeOnly: true}
      responses:
        '200':
          description: 갱신된 현재 세션
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionView'}
        '403': {description: 'PASSWORD_INCORRECT(현재 비밀번호 틀림; 로그인 실패 한도에 센다) 또는 CSRF/Origin 거부', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/source-roots:
    get:
      operationId: listSourceRoots
      x-codeye-status: implemented
      description: 사용자에게 허가된 source root. 서버 경로는 반환하지 않는다.
      responses:
        '200':
          description: 허가된 root 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, label]
                      properties:
                        id: {type: string, format: uuid}
                        label: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/providers:
    get:
      operationId: listProviders
      x-codeye-status: implemented
      description: 승인된 공개 HTTPS GitHub/GHES host. 비공개 저장소 인증은 아직 없다.
      responses:
        '200':
          description: provider 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, kind, host]
                      properties:
                        id: {type: string, format: uuid}
                        kind: {enum: [github, ghes]}
                        host: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects:
    get:
      operationId: listProjects
      x-codeye-status: implemented
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: ACL을 통과한 프로젝트만 반환
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Project'}}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createProject
      x-codeye-status: implemented
      description: >-
        source 선언을 형식·권한(root grant, provider 존재·host 일치)만 검사해 저장한다. 파일 시스템이나
        네트워크에 접근하지 않으므로 응답의 source_status는 declared_unverified다. 허가되지 않은 root와
        없는 provider는 같은 404다. ssh/scp/git:// URL은 422 SOURCE_UNSUPPORTED,
        attachment_ids가 있으면 422 ATTACHMENTS_UNSUPPORTED다.
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectCreate'}
      responses:
        '201':
          description: 프로젝트 등록. 상세 설명은 필수가 아니다.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/runs:
    parameters:
      - {name: project_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: createRun
      x-codeye-status: implemented
      description: >-
        같은 actor·project·Idempotency-Key와 같은 body(정규화 JSON digest)는 같은 run을 202로 반환한다.
        다른 body는 409 IDEMPOTENCY_CONFLICT. viewer는 403, 프로젝트 비구성원은 404다.
        worker가 없는 빌드에서 run은 queued에 머문다.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [profile, source_policy, scope]
              properties:
                profile: {enum: [deep-review, with-tests, focused]}
                source_policy: {const: latest_at_acquire}
                scope: {$ref: '#/components/schemas/Scope'}
      responses:
        '202':
          description: 영속 큐 등록 완료. 소스는 acquire에서 고정한다.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunAck'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}:
    parameters:
      - {name: project_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getProject
      x-codeye-status: implemented
      responses:
        '200':
          description: 접근 가능한 프로젝트. 비구성원·없는 ID는 같은 404.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{run_id}:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getRun
      x-codeye-status: implemented
      responses:
        '200':
          description: 현재 실행 상태
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunView'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{run_id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    post:
      operationId: cancelRun
      x-codeye-status: implemented
      description: >-
        멱등적 취소 요청. 실제 하위 프로세스 종료는 run 상태로 확인한다. 실행 자식이 없는 queued run은
        cancelled로 바로 종료된다. recovery_required는 409.
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
      responses:
        '202':
          description: 취소 의도 저장
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunAck'}
        '200':
          description: 이미 종료되었거나 이미 취소 중인 실행의 현재 상태(변경 없음)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunAck'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{run_id}/report:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getReport
      x-codeye-status: implemented
      description: 프로젝트 읽기 권한으로 고정된 revision을 조회한다. 기본 내보내기는 도구 원문과 코드 인용을 생략한다.
      parameters:
        - {name: revision, in: query, schema: {type: integer, minimum: 1, maximum: 1000000}}
        - {name: format, in: query, schema: {enum: [json, markdown, html], default: json}}
        - {name: include_code, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: 검증된 보고서. X-CODEYE-Report-SHA256은 같은 내보내기 옵션의 JSON 해시이고 ETag는 요청 형식의 응답 해시다.
          content:
            application/json:
              schema: {$ref: '../schemas/report.schema.json'}
            text/markdown: {schema: {type: string}}
            text/html: {schema: {type: string}}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{run_id}/reports:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: listReports
      x-codeye-status: implemented
      responses:
        '200':
          description: 프로젝트 읽기 권한으로 확인한 revision 목록. 게시 전에는 빈 목록이다.
          content:
            application/json:
              schema:
                type: object
                required: [items, latest_revision, formats, default_include_code, default_baseline]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, revision, status, quality_verdict, sha256, size_bytes, created_at]
                      properties:
                        id: {type: string}
                        revision: {type: integer, minimum: 1}
                        status: {enum: [completed, partial, failed, cancelled]}
                        quality_verdict: {enum: [attention_required, no_actionable_findings, inconclusive]}
                        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                        size_bytes: {type: integer}
                        created_at: {type: string, format: date-time}
                  latest_revision: {type: [integer, 'null']}
                  formats: {type: array, items: {enum: [json, markdown, html]}}
                  default_include_code: {const: false}
                  default_baseline:
                    description: 비교 화면의 기본 기준(getRunComparison 규칙). 없으면 null.
                    oneOf:
                      - type: 'null'
                      - type: object
                        additionalProperties: false
                        required: [run_id, revision, url]
                        properties:
                          run_id: {type: string}
                          revision: {type: integer, minimum: 1}
                          url: {type: string}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{run_id}/comparison:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getRunComparison
      x-codeye-status: implemented
      description: >-
        프로젝트 읽기 권한(viewer 포함, 비구성원 404)으로 run의 게시 revision(기본 최신)을 기준 revision과 비교한다. 기준은
        baseline(같은 프로젝트의 run만, 다른 프로젝트·없는 run 404, 자기 자신 422) 또는 기본값이다. 기본 기준은 같은 프로젝트에서 먼저 요청된
        run 중 source variant(그 run의 project revision source: Git 저장소+브랜치 또는 root+경로)·profile·scope가 같고 completed/partial
        fp2 보고서(builder 3 이상)가 있는 가장 최근 run의 최신 그런 revision이다. 상태는 저장된 보고서 본문과 run 사실로 매번 다시 계산한다.
        resolved_observed는 같은 source variant·scope 안에서 같은 도구(같은 버전)가 이번 run에 성공했고 그 파일을 실제로 분석했으며 규칙
        문맥(rule pack·선택·저장소 설정·소스 안 억제 처리, builder 4 rule_context; go vet은 합성)이 양쪽 모두 알려져 있고 같으며 이번 run이
        그 진단을 억제됨으로 보고하지 않았을 때만이다(docs/ANALYZERS.md#규칙-문맥과-소스-안-억제).
        모델 후보가 다시 나오지 않은 것은 해결 관찰이 아니다(absent_unverified, model_absence_not_observation). fingerprint 체계가 다르면
        comparable=false이고 entries는 비어 있다. findings는 현재 revision의 각 발견에 대해 게시 시점 disposition(보고서에 고정)과 현재
        disposition(만료·경로 범위·모호한 일치 반영)을 따로 준다. 제목·도구 원문은 싣지 않는다(보고서 본문과 finding_id로 연결).
      parameters:
        - {name: revision, in: query, schema: {type: integer, minimum: 1, maximum: 1000000}}
        - {name: baseline, in: query, schema: {type: string}, description: 기준 run ID(같은 프로젝트)}
        - {name: baseline_revision, in: query, schema: {type: integer, minimum: 1, maximum: 1000000}, description: baseline이 있을 때만}
      responses:
        '200':
          description: 비교와 사람 판정 overlay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunComparison'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/finding-reviews:
    parameters:
      - {name: project_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: listFindingReviews
      x-codeye-status: implemented
      description: >-
        프로젝트 구성원(viewer 포함, 비구성원 404)이 사람 판정을 읽는다. fingerprint를 주면 그 fingerprint의 모든 version(최신 먼저,
        감사 이력), 없으면 fingerprint별 최신 version을 fingerprint 순서로 cursor pagination한다. can_review는 owner·manager·runner 여부다.
      parameters:
        - {name: fingerprint, in: query, schema: {type: string, pattern: '^fp2:[0-9a-f]{64}$'}}
        - {name: cursor, in: query, schema: {type: string, pattern: '^fp2:[0-9a-f]{64}$'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: 판정 목록
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor, can_review]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/FindingReview'}}
                  next_cursor: {type: [string, 'null']}
                  can_review: {type: boolean}
        '400': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createFindingReview
      x-codeye-status: implemented
      description: >-
        owner·manager·runner만 기록한다(viewer 403, 비구성원 404). 판정은 fingerprint의 다음 version으로 추가되며 수정·삭제할 수 없다
        (이 행들이 감사 기록이다). If-Match "N"은 현재 version이어야 하고 첫 판정은 If-None-Match: *를 쓴다. 다르면 409 CONFLICT, 둘 다
        없으면 400. 같은 actor·Idempotency-Key·요청은 같은 행을 200으로 반환하고 다른 요청은 409 IDEMPOTENCY_CONFLICT. reason은 필수(공백 제외
        1..2000자). expires_at은 미래여야 하고, 지나면 현재 화면에서 open으로 읽는다. path_prefix가 있으면 그 경로(또는 아래)에 있는
        발견에만 적용한다. open은 만료·경로 범위를 갖지 않는다. run_id·revision·finding_id는 사람이 판단한 게시 revision의 발견이며 그 본문에
        같은 fingerprint로 있어야 한다(아니면 422). 다른 revision의 발견에는 fingerprint가 그 revision에서 하나뿐이고 식별이 약하지 않을 때만
        자동 적용된다. 그 밖에는 후보 일치(review_match=candidate)로 열린 채 남고 사람이 그 발견에서 다시 기록해야 적용된다.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CSRF'}
        - {name: If-Match, in: header, schema: {type: string}, description: 현재 판정 version ETag("N")}
        - {name: If-None-Match, in: header, schema: {const: '*'}, description: 첫 판정}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FindingReviewCreate'}
      responses:
        '201':
          description: 추가된 version. ETag는 version이다.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FindingReview'}
        '200':
          description: 같은 Idempotency-Key·요청의 재전송(새 version 없음)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FindingReview'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/runs/{run_id}/events:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: streamRunEvents
      x-codeye-status: implemented
      description: >-
        GET /runs/{run_id}와 같은 세션·프로젝트 읽기 권한(비구성원 404). 먼저 GET /runs/{run_id}로 상태와 event_sequence를
        받고 그 값을 cursor로 연결한다. cursor 이후의 저장된 run 이벤트를 sequence 순서로 보낸다. 각 행은 이름 없는 SSE 메시지이며
        `id: <sequence>`와 RunEventData를 담는다(sequence는 상태 변경과 같은 트랜잭션에서 기록한 run 안의 단조 증가 값, DB 행 ID가 아님).
        행 묶음 뒤에는 id 없는 `event: run.view`(GET /runs/{run_id}와 같은 RunView)를 보낸다. id 없는 `event: heartbeat`는 연결 유지용이며
        진행 상태와 cursor를 바꾸지 않는다. `event: state.resync`(reason gap, cursor_ahead, cursor_expired, view_unavailable)는 이 cursor로
        이어갈 수 없다는 뜻이며 클라이언트는 GET /runs/{run_id}를 다시 읽고 새 event_sequence로 다시 연결한다. 서버는 resync 뒤 연결을 닫는다.
        `event: closed`(reason unauthenticated, access_revoked, unavailable)는 로그아웃·세션 만료·권한 상실 등으로 스트림을 끝낸다는 뜻이며
        다시 연결하지 않는다. 세션과 권한은 poll(기본 1초)마다 다시 확인한다. heartbeat 기본 15초, 재생 창 기본 1000 이벤트, 스트림 최대 30분
        (이후 브라우저가 Last-Event-ID로 재연결). 동시 스트림 상한을 넘으면 503 UNAVAILABLE.
      parameters:
        - {name: cursor, in: query, schema: {type: integer, minimum: 0}, description: 마지막으로 반영한 event sequence. Last-Event-ID가 있으면 그 값이 우선한다.}
        - {name: Last-Event-ID, in: header, schema: {type: string, pattern: '^[0-9]{1,16}$'}, description: 브라우저 재연결이 보내는 마지막 id}
      responses:
        '200':
          description: text/event-stream. data 줄은 RunEventData, RunView 또는 StreamControl JSON이다.
          content:
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/schedules:
    parameters:
      - {name: project_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: listSchedules
      x-codeye-status: implemented
      description: 프로젝트 구성원(viewer 포함)이 삭제되지 않은 예약을 생성 순서로 본다. can_manage는 manager 여부다. 비구성원 404.
      responses:
        '200':
          description: 예약 목록
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, can_manage]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Schedule'}}
                  can_manage: {type: boolean}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createSchedule
      x-codeye-status: implemented
      description: >-
        manager만 만든다(runner·viewer 403, 비구성원 404). 같은 actor·project·Idempotency-Key와 같은 정규화 정의는 같은 예약을 201로
        반환하고 다른 정의는 409 IDEMPOTENCY_CONFLICT(run의 멱등성 키와 별개). cron·timezone·policy·run 오류와 9년 안에 발생하지 않는 표현은
        422 VALIDATION_FAILED. 프로젝트당 살아 있는 예약 50개를 넘으면 409 CONFLICT. 첫 occurrence는 생성 시각 이후이며 과거를 소급 실행하지 않는다.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScheduleCreate'}
      responses:
        '201':
          description: 저장된 예약. ETag는 version이다.
          headers:
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/projects/{project_id}/schedules/{schedule_id}:
    parameters:
      - {name: project_id, in: path, required: true, schema: {type: string}}
      - {name: schedule_id, in: path, required: true, schema: {type: string}}
    patch:
      operationId: updateSchedule
      x-codeye-status: implemented
      description: >-
        manager만 바꾼다. If-Match는 현재 version("N")이어야 하며 다르면 409 CONFLICT, 없으면 400. 바꾼 사람이 예약 run의 요청자가 된다.
        cron·timezone 변경과 재활성화는 지금 이후의 다음 occurrence부터 다시 계산한다(비활성 기간을 소급하지 않음). 비활성화는 대기 중
        occurrence를 cancelled(schedule_disabled)로 닫는다.
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: 예약 version ETag}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SchedulePatch'}
      responses:
        '200':
          description: 새 version
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteSchedule
      x-codeye-status: implemented
      description: manager만 지운다(soft delete). If-Match 규칙은 patch와 같다. occurrence와 run은 이력으로 남고 대기 중 occurrence는 cancelled(schedule_deleted)가 된다.
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}, description: 예약 version ETag}
        - {$ref: '#/components/parameters/CSRF'}
      responses:
        '204': {description: 삭제됨}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
