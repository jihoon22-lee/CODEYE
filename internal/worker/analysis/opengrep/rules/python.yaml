  - id: codeye.python.html-injection
    mode: taint
    languages: [python]
    severity: WARNING
    message: HTTP request input reaches HTML or template source without escaping
    metadata: {cwe: ["CWE-79"], codeye_family: html-injection}
    options: {taint_intrafile: true}
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: flask.request.$ATTR
              - pattern: flask.request.$ATTR(...)
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(args|form|values|json|data|cookies|headers|files|view_args|path|full_path|url|query_string|stream|get_data|get_json)$
      - patterns:
          - pattern: $REQ.$ATTR
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(request|req)$
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(GET|POST|body|COOKIES|FILES|META|data|headers|cookies|query_params|path_params|match_info)$
      # Starlette and FastAPI: the decoded body of the request.
      - patterns:
          - pattern: $REQ.$READ(...)
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(request|req)$
          - metavariable-regex:
              metavariable: $READ
              regex: ^(json|form|body)$
      # A Flask view's parameters are the variables of its URL rule.
      - patterns:
          - pattern-inside: |
              @$APP.route(...)
              def $VIEW(..., $PARAM, ...):
                ...
          - pattern: $PARAM
      - patterns:
          - pattern-inside: |
              class $HANDLER(..., BaseHTTPRequestHandler, ...):
                ...
          - pattern-either:
              - pattern: self.path
              - pattern: self.headers
              - pattern: self.rfile.read(...)
    pattern-sanitizers:
      # The content of a file is not request input, even when its name is.
      - pattern: open(...).read(...)
      - patterns:
          - pattern-inside: |
              with open(...) as $F:
                ...
          - pattern: $F.read(...)
      - pattern: int(...)
      - pattern: html.escape(...)
      - pattern: markupsafe.escape(...)
      - pattern: flask.escape(...)
      - pattern: django.utils.html.escape(...)
      - pattern: markupsafe.Markup.escape(...)
      # URL encoding leaves no HTML markup.
      - pattern: urllib.parse.urlencode(...)
      - pattern: urllib.parse.quote(...)
      - pattern: urllib.parse.quote_plus(...)
      - pattern: $QUERY.urlencode(...)
      # A project's own HTML escaper, often in another module, by its name.
      - patterns:
          - pattern: $ESCAPE(...)
          - metavariable-regex:
              metavariable: $ESCAPE
              regex: ^(.*\.)?(\w*escape_html\w*|\w*html_escape\w*|escape_for_html|escape_html|escape)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: flask.render_template_string($HTML, ...)
              - pattern: jinja2.Template($HTML, ...)
              - pattern: markupsafe.Markup($HTML)
              - pattern: flask.Markup($HTML)
              - pattern: django.utils.safestring.mark_safe($HTML)
          - focus-metavariable: $HTML
      # A Flask view that returns a string answers with text/html.
      - patterns:
          - pattern-inside: |
              @$APP.route(...)
              def $VIEW(...):
                ...
          - pattern-either:
              - pattern: return "..." + $X
              - pattern: return $X + "..."
              - pattern: return f"..."
              - pattern: return "...".format(...)
              - pattern: return "..." % $X
      # The string a Flask view builds in a variable and returns: the text
      # assigned or appended to that variable.
      - patterns:
          - pattern-inside: |
              @$APP.route(...)
              def $VIEW(...):
                ...
          - pattern-either:
              - pattern-inside: |
                  $R += $TEXT
                  ...
                  return $R
              - pattern-inside: |
                  $R = $TEXT
                  ...
                  return $R
          - pattern-either:
              - pattern: f"..."
              - pattern: '"..." + $X'
              - pattern: $X + "..."
              - pattern: '"...".format(...)'
              - pattern: '"..." % $X'
          - pattern: $TEXT
