  - id: codeye.python.ssrf
    mode: taint
    languages: [python]
    severity: WARNING
    message: HTTP request input decides the address of an outgoing HTTP request
    metadata: {cwe: ["CWE-918"], codeye_family: ssrf}
    options: {taint_intrafile: true}
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: flask.request.$ATTR
              - pattern: flask.request.$ATTR(...)
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(args|form|values|json|data|cookies|headers|files|view_args|path|full_path|url|query_string|stream|get_data|get_json)$
      - patterns:
          - pattern: $REQ.$ATTR
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(request|req)$
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(GET|POST|body|COOKIES|FILES|META|data|headers|cookies|query_params|path_params|match_info)$
      # Starlette and FastAPI: the decoded body of the request.
      - patterns:
          - pattern: $REQ.$READ(...)
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(request|req)$
          - metavariable-regex:
              metavariable: $READ
              regex: ^(json|form|body)$
      # A Flask view's parameters are the variables of its URL rule.
      - patterns:
          - pattern-inside: |
              @$APP.route(...)
              def $VIEW(..., $PARAM, ...):
                ...
          - pattern: $PARAM
      - patterns:
          - pattern-inside: |
              class $HANDLER(..., BaseHTTPRequestHandler, ...):
                ...
          - pattern-either:
              - pattern: self.path
              - pattern: self.headers
              - pattern: self.rfile.read(...)
    pattern-sanitizers:
      # The content of a file is not request input, even when its name is.
      - pattern: open(...).read(...)
      - patterns:
          - pattern-inside: |
              with open(...) as $F:
                ...
          - pattern: $F.read(...)
      - pattern: int(...)
      # A constant scheme, host and path prefix leaves only the path or query
      # to the input.
      - patterns:
          - pattern-either:
              - pattern: '"$PREFIX" + $X'
              - pattern: f"$PREFIX{...}..."
              - pattern: '"$PREFIX".format(...)'
              - pattern: '"$PREFIX" % $X'
          - metavariable-regex:
              metavariable: $PREFIX
              regex: ^https?://[^/{}%]+/
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.$METHOD($URL, ...)
              - pattern: httpx.$METHOD($URL, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|head|options|stream)$
          - focus-metavariable: $URL
      - patterns:
          - pattern-either:
              - pattern: requests.request($M, $URL, ...)
              - pattern: httpx.request($M, $URL, ...)
              - pattern: urllib.request.urlopen($URL, ...)
              - pattern: urllib.request.Request($URL, ...)
          - focus-metavariable: $URL

