      # A Flask view's parameters are the variables of its URL rule.
      - patterns:
          - pattern-inside: |
              @$APP.route(...)
              def $VIEW(..., $PARAM, ...):
                ...
          - pattern: $PARAM
      - patterns:
          - pattern-inside: |
              class $HANDLER(..., BaseHTTPRequestHandler, ...):
                ...
          - pattern-either:
              - pattern: self.path
              - pattern: self.headers
              - pattern: self.rfile.read(...)
    pattern-sanitizers:
      # The content of a file is not request input, even when its name is.
      - pattern: open(...).read(...)
      - patterns:
          - pattern-inside: |
              with open(...) as $F:
                ...
          - pattern: $F.read(...)
      - pattern: int(...)
      - pattern: float(...)
