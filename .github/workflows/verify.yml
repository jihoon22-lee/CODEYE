name: Verify CODEYE

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  native-linux:
    name: Linux / PostgreSQL / contracts
    runs-on: ubuntu-24.04
    # Installing the test browser and its OS packages took 7-8 minutes on the
    # hosted runner; with the integration and race tests the job ran at 14-15
    # minutes. The browser download is cached by Playwright version, so a cache
    # hit installs only the OS packages.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.4'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build browser fixture assets
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Read test browser version
        id: playwright
        run: echo "version=$(node -p "require('./web/package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache test browser download
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install test browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Install test browser OS dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium
      - name: Prepare test dependencies
        run: |
          python -m pip install -r scripts/requirements.txt
          pg_config --version
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Check Go formatting and static checks
        run: |
          test -z "$(gofmt -l cmd internal migrations)"
          go vet ./...
      - name: Native database integration and race tests
        run: python scripts/test_postgres.py --nodes --web --scheduler --personal
      - name: Documentation contracts and regression fixture
        run: |
          python -m unittest discover -s scripts -p test_model_budget_relay.py -v
          python -m unittest discover -s scripts -p test_quality_eval.py -v
          python scripts/validate_bundle.py
          python -m unittest discover -s fixtures/cleanup -p 'test_*.py' -v
          python fixtures/regression/corpus.py --check
      - name: Build CLI
        run: go build -o bin/codeye ./cmd/codeye

  native-windows:
    name: Windows / Go unit tests
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache: true
      - name: Unit tests and static checks
        run: |
          go test -count=1 -v ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o bin/codeye.exe ./cmd/codeye

  web:
    name: Web / tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
